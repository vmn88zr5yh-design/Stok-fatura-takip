<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSB POS</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0d102b; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #1e293b; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 600px; margin: auto; width: 100%; }
    @media(min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; text-align: center; color: white; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .card:active { background: rgba(255,255,255,0.15); transform: scale(0.97); }
    .full { grid-column: span 2; }
    @media(min-width: 640px) { .full { grid-column: span 3; } }
    #moduleContent { display: none; background: #1e293b; border-radius: 20px; padding: 20px; flex: 1; max-width: 600px; margin: auto; width: 100%; border: 1px solid rgba(255,255,255,0.1); }
    .btn { background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 14px; }
    input, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; margin-top: 5px; margin-bottom: 10px; font-size: 14px; }
    .item-row { background: #0f172a; padding: 12px; border-radius: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
    .back-btn { background: #334155; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight:900; font-size:16px; color:#f59e0b;">KSB POS <span style="font-size:10px; color:#94a3b8;">v11.0</span></div>
      <div style="font-size:11px; color:#10b981;">● Sistem Çalışır Durumda</div>
    </div>
    <div style="text-align:right;">
      <div style="font-weight:bold; font-size:12px;">ALİ OSMAN BEY</div>
      <div style="font-size:10px; color:#94a3b8;">YÖNETİCİ</div>
    </div>
  </header>

  <!-- ANA MENÜ -->
  <div id="mainDashboard" class="grid">
    <div class="card" onclick="openModule('faturalar')">
      <span style="font-size:28px;">📸</span>
      <span>Fatura & Fotoğraf</span>
    </div>
    <div class="card" onclick="openModule('cariler')">
      <span style="font-size:28px;">🏢</span>
      <span>Cari Borç Takibi</span>
    </div>
    <div class="card" onclick="openModule('stoklar')">
      <span style="font-size:28px;">📦</span>
      <span>Stok Yönetimi</span>
    </div>
    <div class="card" onclick="openModule('personel')">
      <span style="font-size:28px;">👥</span>
      <span>Personel Listesi</span>
    </div>
    <div class="card" onclick="openModule('maaslar')">
      <span style="font-size:28px;">💰</span>
      <span>Maaş Takibi</span>
    </div>
    <div class="card" onclick="openModule('raporlar')">
      <span style="font-size:28px;">📊</span>
      <span>Ay Sonu Raporu</span>
    </div>
    <div class="card full" onclick="openModule('yoneticiler')">
      <span style="font-size:22px;">🛡️</span>
      <span>Yönetici Yetki & Aktif/Pasif Paneli</span>
    </div>
  </div>

  <!-- MODÜL EKRANI -->
  <div id="moduleContent">
    <button class="back-btn" onclick="closeModule()">⬅️ Ana Menüye Dön</button>
    <h3 id="moduleTitle" style="margin-top:0; color:#f59e0b; font-size:16px;"></h3>
    <div id="moduleBody"></div>
  </div>

  <footer style="text-align:center; font-size:11px; color:#64748b; margin-top:20px;">
    KSB POS SYSTEM &bull; <span id="clock">--:--</span>
  </footer>

  <script>
    let invoices = JSON.parse(localStorage.getItem('ksb_inv')) || [];
    let suppliers = JSON.parse(localStorage.getItem('ksb_sup')) || [{ name: 'Kahve Sarayı Tedarik', balance: 12500 }];
    let staff = JSON.parse(localStorage.getItem('ksb_stf')) || [{ id: 1, name: 'Barista Ahmet', role: 'Barista', salary: 25000, paid: false }];
    let stocks = JSON.parse(localStorage.getItem('ksb_stk')) || [{ id: 1, name: 'Espresso (Kg)', amount: 15, unitPrice: 450 }];
    let managers = JSON.parse(localStorage.getItem('ksb_mgr')) || [
      { id: 1, name: 'Ali Osman Bey', email: 'ali@dukkan.com', active: true },
      { id: 2, name: 'İskender Selçuk', email: 'aliosman.erol@icloud.com', active: true }
    ];

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      localStorage.setItem('ksb_inv', JSON.stringify(invoices));
      localStorage.setItem('ksb_sup', JSON.stringify(suppliers));
      localStorage.setItem('ksb_stf', JSON.stringify(staff));
      localStorage.setItem('ksb_stk', JSON.stringify(stocks));
      localStorage.setItem('ksb_mgr', JSON.stringify(managers));
    }

    function openModule(name) {
      document.getElementById('mainDashboard').style.display = 'none';
      document.getElementById('moduleContent').style.display = 'block';
      let title = document.getElementById('moduleTitle');
      let body = document.getElementById('moduleBody');

      if(name === 'faturalar') {
        title.innerText = '📸 Fatura & Fotoğraf Yükleme';
        body.innerHTML = `
          <input type="file" accept="image/*" capture="environment">
          <input type="text" id="iSup" placeholder="Tedarikçi / Firma Adı">
          <div style="display:flex; gap:10px;">
            <input type="number" id="iSub" placeholder="Ara Toplam">
            <input type="number" id="iKdv" placeholder="KDV">
          </div>
          <input type="number" id="iDisc" placeholder="İskonto">
          <button class="btn" onclick="addInv()">Faturayı Kaydet</button>
          <div id="iList" style="margin-top:15px;"></div>
        `;
        renderInvList();
      } else if(name === 'cariler') {
        title.innerText = '🏢 Cari Borç Takibi';
        body.innerHTML = `
          <input type="text" id="sName" placeholder="Tedarikçi Adı">
          <input type="number" id="sBal" placeholder="Açılış Borcu (TL)">
          <button class="btn" onclick="addSup()">Tedarikçi Ekle</button>
          <div id="sList" style="margin-top:15px;"></div>
        `;
        renderSupList();
      } else if(name === 'stoklar') {
        title.innerText = '📦 Stok Yönetimi';
        body.innerHTML = `
          <input type="text" id="stName" placeholder="Ürün Adı">
          <div style="display:flex; gap:10px;">
            <input type="number" id="stAmt" placeholder="Miktar">
            <input type="number" id="stPrice" placeholder="Birim Fiyat">
          </div>
          <button class="btn" onclick="addStk()">Stok Kalemi Ekle</button>
          <div id="stList" style="margin-top:15px;"></div>
        `;
        renderStkList();
      } else if(name === 'personel') {
        title.innerText = '👥 Personel Listesi';
        body.innerHTML = `
          <input type="text" id="pName" placeholder="Personel Adı">
          <div style="display:flex; gap:10px;">
            <input type="text" id="pRole" placeholder="Görevi">
            <input type="number" id="pSal" placeholder="Maaş (TL)">
          </div>
          <button class="btn" onclick="addStaff()">Personel Kaydet</button>
          <div id="pList" style="margin-top:15px;"></div>
        `;
        renderStaffList();
      } else if(name === 'maaslar') {
        title.innerText = '💰 Maaş Takibi';
        body.innerHTML = `<div id="salList"></div>`;
        renderSalList();
      } else if(name === 'raporlar') {
        title.innerText = '📊 Ay Sonu Gider Raporu';
        let tInv = invoices.reduce((a,b)=>a+b.total,0);
        let tSal = staff.reduce((a,b)=>a+b.salary,0);
        let tDeb = suppliers.reduce((a,b)=>a+b.balance,0);
        body.innerHTML = `
          <div class="item-row"><span>Toplam Fatura:</span> <b style="color:#ec4899;">${tInv} TL</b></div>
          <div class="item-row"><span>Toplam Maaş:</span> <b style="color:#f59e0b;">${tSal} TL</b></div>
          <div class="item-row"><span>Tedarikçi Borçları:</span> <b style="color:#f43f5e;">${tDeb} TL</b></div>
          <div class="item-row" style="background:#312e81; margin-top:15px;"><span>AYLIK TOPLAM:</span> <b style="color:#10b981; font-size:16px;">${tInv+tSal} TL</b></div>
        `;
      } else if(name === 'yoneticiler') {
        title.innerText = '🛡️ Yönetici Yetki & Aktif/Pasif Paneli';
        body.innerHTML = `
          <input type="text" id="mName" placeholder="Ad Soyad">
          <input type="email" id="mMail" placeholder="E-posta">
          <button class="btn" onclick="addMgr()">Yönetici Ekle</button>
          <div id="mList" style="margin-top:15px;"></div>
        `;
        renderMgrList();
      }
    }

    function closeModule() {
      document.getElementById('mainDashboard').style.display = 'grid';
      document.getElementById('moduleContent').style.display = 'none';
    }

    // Fonksiyonlar
    function addInv() {
      let sup = document.getElementById('iSup').value.trim();
      let sub = parseFloat(document.getElementById('iSub').value) || 0;
      let kdv = parseFloat(document.getElementById('iKdv').value) || 0;
      let disc = parseFloat(document.getElementById('iDisc').value) || 0;
      let total = sub + kdv - disc;
      if(sup && total > 0) {
        invoices.push({ sup, total });
        let s = suppliers.find(x => x.name.toLowerCase() === sup.toLowerCase());
        if(s) s.balance += total; else suppliers.push({ name: sup, balance: total });
        saveData(); renderInvList(); alert('Fatura kaydedildi!');
      } else { alert('Eksik bilgi.'); }
    }
    function renderInvList() {
      let d = document.getElementById('iList');
      if(d) d.innerHTML = invoices.map((x,i)=>`<div class="item-row"><span><b>${x.sup}</b><br><small style="color:#ec4899;">${x.total} TL</small></span><button style="background:#7f1d1d; color:#fca5a5; border:none; padding:5px 10px; border-radius:6px;" onclick="invoices.splice(${i},1);saveData();renderInvList();">Sil</button></div>`).join('');
    }

    function addSup() {
      let name = document.getElementById('sName').value.trim();
      let balance = parseFloat(document.getElementById('sBal').value) || 0;
      if(name) { suppliers.push({name, balance}); saveData(); renderSupList(); }
    }
    function renderSupList() {
      let d = document.getElementById('sList');
      if(d) d.innerHTML = suppliers.map((x,i)=>`<div class="item-row"><span><b>${x.name}</b><br><small style="color:#f43f5e;">Borç: ${x.balance} TL</small></span><div style="display:flex; gap:5px;"><button style="background:#065f46; color:#6ee7b7; border:none; padding:5px 8px; border-radius:6px;" onclick="let m=prompt('Ödeme:');if(m){x.balance=Math.max(0,x.balance-m);saveData();renderSupList();}">Öde</button><button style="background:#7f1d1d; color:#fca5a5; border:none; padding:5px 8px; border-radius:6px;" onclick="suppliers.splice(${i},1);saveData();renderSupList();">Sil</button></div></div>`).join('');
    }

    function addStk() {
      let name = document.getElementById('stName').value.trim();
      let amount = parseFloat(document.getElementById('stAmt').value) || 0;
      let unitPrice = parseFloat(document.getElementById('stPrice').value) || 0;
      if(name) { stocks.push({id:Date.now(), name, amount, unitPrice}); saveData(); renderStkList(); }
    }
    function renderStkList() {
      let d = document.getElementById('stList');
      if(d) d.innerHTML = stocks.map(x=>`<div class="item-row"><span><b>${x.name}</b><br><small>Birim: ${x.unitPrice}₺</small></span><div style="display:flex; align-items:center; gap:8px;"><button style="background:#334155; color:white; border:none; width:25px; height:25px; border-radius:5px;" onclick="x.amount=Math.max(0,x.amount-1);saveData();renderStkList();">-</button><b style="color:#f59e0b;">${x.amount}</b><button style="background:#334155; color:white; border:none; width:25px; height:25px; border-radius:5px;" onclick="x.amount+=1;saveData();renderStkList();">+</button></div></div>`).join('');
    }

    function addStaff() {
      let name = document.getElementById('pName').value.trim();
      let role = document.getElementById('pRole').value.trim() || 'Personel';
      let salary = parseFloat(document.getElementById('pSal').value) || 0;
      if(name) { staff.push({id:Date.now(), name, role, salary, paid:false}); saveData(); renderStaffList(); }
    }
    function renderStaffList() {
      let d = document.getElementById('pList');
      if(d) d.innerHTML = staff.map(x=>`<div class="item-row"><span><b>${x.name}</b> (${x.role})<br><small style="color:#f59e0b;">Maaş: ${x.salary} TL</small></span><button style="background:#7f1d1d; color:#fca5a5; border:none; padding:5px 10px; border-radius:6px;" onclick="staff=staff.filter(s=>s.id!==${x.id});saveData();renderStaffList();">Sil</button></div>`).join('');
    }

    function renderSalList() {
      let d = document.getElementById('salList');
      if(d) d.innerHTML = staff.map(x=>`<div class="item-row"><span><b>${x.name}</b><br><small style="color:#f59e0b;">${x.salary} TL</small></span><button style="background:${x.paid?'#065f46':'#7f1d1d'}; color:${x.paid?'#6ee7b7':'#fca5a5'}; border:none; padding:6px 12px; border-radius:6px; font-weight:bold;" onclick="x.paid=!x.paid;saveData();renderSalList();">${x.paid?'Ödendi ✓':'Bekliyor'}</button></div>`).join('');
    }

    function addMgr() {
      let name = document.getElementById('mName').value.trim();
      let email = document.getElementById('mMail').value.trim();
      if(name && email) { managers.push({id:Date.now(), name, email, active:true}); saveData(); renderMgrList(); }
    }
    function renderMgrList() {
      let d = document.getElementById('mList');
      if(d) d.innerHTML = managers.map(x=>`<div class="item-row"><span><b>${x.name}</b><br><small>${x.email}</small></span><div style="display:flex; gap:5px;"><button style="background:${x.active?'#78350f':'#065f46'}; color:white; border:none; padding:5px 8px; border-radius:6px; font-size:11px;" onclick="x.active=!x.active;saveData();renderMgrList();">${x.active?'Pasif Yap':'Aktif Yap'}</button><button style="background:#7f1d1d; color:#fca5a5; border:none; padding:5px 8px; border-radius:6px; font-size:11px;" onclick="managers=managers.filter(m=>m.id!==${x.id});saveData();renderMgrList();">Sil</button></div></div>`).join('');
    }
  </script>
</body>
</html>
