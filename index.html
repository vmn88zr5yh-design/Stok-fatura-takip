<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS & Restoran Yönetim Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d102b;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .pos-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease-in-out;
    }
    .pos-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .pos-card:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 select-none">

  <!-- Üst Bilgi Çubuğu -->
  <header class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-white/10 mb-4 sm:mb-6">
    <div class="flex items-center gap-3 text-xs">
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Server</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Internet</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
    </div>

    <div class="flex items-center gap-3 text-right">
      <div class="text-xs">
        <div class="font-bold text-white tracking-wide">ALİ OSMAN BEY</div>
        <div class="text-[10px] text-slate-400">YÖNETİCİ / ÖDEME NOKTASI</div>
      </div>
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-lg">
        AO
      </div>
    </div>
  </header>

  <!-- ANA DASHBOARD -->
  <main id="mainDashboard" class="flex-1 max-w-4xl mx-auto w-full flex flex-col justify-center my-auto">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5">
      <button onclick="openModule('faturalar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center shadow-lg shadow-pink-500/30 group-hover:scale-105 transition text-2xl">📜</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Faturalar (Pro OCR)</span>
      </button>

      <button onclick="openModule('cariler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition text-2xl">🏢</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Tedarikçi Carileri</span>
      </button>

      <button onclick="openModule('stoklar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition text-2xl">📦</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Stok Sayımı</span>
      </button>

      <button onclick="openModule('personel')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-105 transition text-2xl">👥</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Personel Listesi</span>
      </button>

      <button onclick="openModule('maaslar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/30 group-hover:scale-105 transition text-2xl">💰</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Maaş Takibi</span>
      </button>

      <button onclick="openModule('raporlar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-fuchsia-500 to-pink-600 flex items-center justify-center shadow-lg shadow-fuchsia-500/30 group-hover:scale-105 transition text-2xl">📊</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Ay Sonu Raporu</span>
      </button>
    </div>
  </main>

  <!-- MODÜL İÇERİK EKRANI -->
  <section id="moduleContent" class="hidden flex-1 max-w-4xl mx-auto w-full bg-slate-900/90 rounded-3xl p-4 sm:p-6 border border-white/10 shadow-2xl flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
      <button onclick="closeModule()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2 border border-white/10">
        ⬅️ Ana Menü
      </button>
      <h2 id="moduleTitle" class="text-sm sm:text-base font-bold text-white">Modül Başlığı</h2>
    </div>
    <div id="moduleBody" class="flex-1 overflow-y-auto space-y-4 text-xs"></div>
  </section>

  <!-- FATURA DETAY MODALI -->
  <div id="invoiceModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-white/10 w-full max-w-2xl rounded-3xl p-5 max-h-[90vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
        <h3 id="modalInvTitle" class="font-bold text-white text-sm">Fatura Detayları</h3>
        <button onclick="closeInvoiceModal()" class="text-slate-400 hover:text-white font-bold text-base px-2">✕</button>
      </div>
      <div id="modalInvContent" class="flex-1 overflow-y-auto space-y-3 text-xs"></div>
    </div>
  </div>

  <footer class="flex justify-between items-center text-[11px] text-slate-500 pt-3 border-t border-white/5">
    <div>POS CENTURY v5.1</div>
    <div id="clockDisplay" class="font-bold text-slate-400">--:--</div>
  </footer>

  <script>
    let invoices = JSON.parse(localStorage.getItem('invoices_data_v11')) || [];
    let suppliers = JSON.parse(localStorage.getItem('suppliers_data_v11')) || ['İzze Kahve', 'Orka Akademi', 'Leonaza Gıda'];
    let staffList = JSON.parse(localStorage.getItem('staff_data_v11')) || [];
    let stockList = JSON.parse(localStorage.getItem('stock_data_v11')) || [];

    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      localStorage.setItem('invoices_data_v11', JSON.stringify(invoices));
      localStorage.setItem('suppliers_data_v11', JSON.stringify(suppliers));
      localStorage.setItem('staff_data_v11', JSON.stringify(staffList));
      localStorage.setItem('stock_data_v11', JSON.stringify(stockList));
    }

    function openModule(moduleName) {
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('moduleContent').classList.remove('hidden');
      const title = document.getElementById('moduleTitle');
      const body = document.getElementById('moduleBody');

      if (moduleName === 'faturalar') {
        title.innerText = '📜 Profesyonel Fatura Tarayıcı';
        renderInvoicesView(body);
      } else if (moduleName === 'cariler') {
        title.innerText = '🏢 Tedarikçi Carileri';
        renderSuppliersView(body);
      } else if (moduleName === 'stoklar') {
        title.innerText = '📦 Stok Yönetimi';
        renderStockView(body);
      } else if (moduleName === 'personel') {
        title.innerText = '👥 Personel Listesi';
        renderStaffView(body);
      } else if (moduleName === 'maaslar') {
        title.innerText = '💰 Maaş Takibi';
        renderSalariesView(body);
      } else if (moduleName === 'raporlar') {
        title.innerText = '📊 Ay Sonu Gider Raporu';
        renderReportsView(body);
      }
    }

    function closeModule() {
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('moduleContent').classList.add('hidden');
    }

    function renderInvoicesView(container) {
      container.innerHTML = `
        <div class="bg-slate-800 p-4 rounded-2xl border border-white/10 space-y-3">
          <span class="font-bold text-white block text-sm">📸 Fatura Fotoğrafı Yükle:</span>
          <p class="text-[11px] text-slate-400">Yüklediğiniz faturadaki şirket adı, doğru ürün açıklaması ve ödenecek net toplam otomatik olarak ayrıştırılır.</p>
          
          <input type="file" id="invImg" accept="image/*" class="hidden" onchange="runProOCR(event)">
          <label for="invImg" class="w-full bg-pink-600 hover:bg-pink-700 py-3 rounded-xl text-white font-bold text-center cursor-pointer block text-xs shadow-lg shadow-pink-600/30">
            Fatura Fotoğrafı Seç / Tara
          </label>
          <p id="ocrStatus" class="text-xs text-amber-400 text-center font-semibold"></p>
        </div>

        <div class="space-y-2 pt-2">
          <span class="font-bold text-slate-400 block">Kayıtlı Faturalar (İçeriğini görmek için tıkla):</span>
          <div id="invoiceListContainer" class="space-y-2"></div>
        </div>
      `;
      renderInvoiceList();
    }

    async function runProOCR(e) {
      let file = e.target.files[0];
      let status = document.getElementById('ocrStatus');
      if (!file) return;

      status.innerText = "⏳ Fatura taranıyor ve analiz ediliyor...";

      try {
        const result = await Tesseract.recognize(file, 'tur+eng', {
          logger: m => {
            if(m.status === 'recognizing text') {
              status.innerText = `⏳ Taranıyor: %${Math.round(m.progress * 100)}`;
            }
          }
        });

        let text = result.data.text;
        let lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);

        // 1. Firma Adı Tespiti
        let firmaAdi = "Tedarikçi Firma";
        for (let line of lines) {
          let upper = line.toLocaleUpperCase('tr-TR');
          if (upper.includes('ORKA') || upper.includes('İZZE') || upper.includes('LEONAZA') || upper.includes('LTD') || upper.includes('A.Ş') || upper.includes('ŞTİ')) {
            firmaAdi = line;
            break;
          }
        }
        if (!suppliers.includes(firmaAdi)) suppliers.push(firmaAdi);

        // 2. Ödenecek Net Tutar Tespiti (Büyük rakamları ayıkla)
        let numbers = text.match(/\d{1,3}([.,]\d{3})*[.,]\d{2}/g) || [];
        let cleanNumbers = numbers.map(n => parseFloat(n.replace(/\./g, '').replace(',', '.'))).filter(n => !isNaN(n) && n > 100);
        // Faturadaki en büyük mantıklı tutar genellikle "Ödenecek Tutar"dır
        let genelToplam = cleanNumbers.length > 0 ? Math.max(...cleanNumbers) : 1500.00;

        // 3. Ürün / Malzeme Açıklaması Tespiti (Adresleri ve telefonları ele)
        let urunAdi = "Fatura Ürün Kalemi";
        for (let line of lines) {
          let upper = line.toLocaleUpperCase('tr-TR');
          if ((upper.includes('STRECH') || upper.includes('BLEND') || upper.includes('KAHVE') || upper.includes('GR') || upper.includes('KG') || upper.includes('ADET')) && !upper.includes('MAHALLESI') && !upper.includes('CADDESI') && !upper.includes('SOKAK')) {
            urunAdi = line;
            break;
          }
        }

        let newInv = {
          id: Date.now(),
          firma: firmaAdi,
          tarih: new Date().toLocaleDateString(),
          kalemler: [
            { ad: urunAdi, miktar: 1, birimFiyat: genelToplam, toplamTutar: genelToplam }
          ],
          malHizmetToplami: genelToplam,
          genelToplam: genelToplam,
          isPaid: false
        };

        invoices.unshift(newInv);
        saveData();
        renderInvoiceList();
        status.innerText = "✅ Fatura başarıyla tarandı ve eklendi!";
      } catch (err) {
        status.innerText = "❌ Tarama başarısız oldu. Lütfen tekrar deneyin.";
      }
    }

    function renderInvoiceList() {
      const list = document.getElementById('invoiceListContainer');
      if (!list) return;
      if (invoices.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Henüz kayıtlı fatura bulunmuyor.</div>`;
        return;
      }
      list.innerHTML = '';
      invoices.forEach(inv => {
        list.innerHTML += `
          <div class="bg-slate-800/90 p-3.5 rounded-2xl border border-white/5 flex justify-between items-center hover:border-white/20 transition">
            <div onclick="openInvoiceDetail(${inv.id})" class="cursor-pointer flex-1">
              <div class="font-bold text-white text-sm">🏢 ${inv.firma} <span class="text-[10px] text-slate-400">(${inv.tarih})</span></div>
              <div class="text-[11px] text-indigo-300 mt-0.5">📦 ${inv.kalemler.length} kalem ürün (İncelemek için tıkla)</div>
              <div class="text-xs font-black text-emerald-400 mt-1">Ödenecek Toplam: ${Number(inv.genelToplam).toFixed(2)} TL</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="toggleInvPaid(${inv.id})" class="px-3 py-1.5 rounded-xl text-[10px] font-bold ${inv.isPaid ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/30' : 'bg-red-950 text-red-300 border border-red-500/30'}">
                ${inv.isPaid ? 'ÖDENDİ ✓' : 'ÖDENMEDİ'}
              </button>
              <button onclick="deleteInvoice(${inv.id})" class="text-red-400 font-bold p-1">🗑️</button>
            </div>
          </div>
        `;
      });
    }

    function openInvoiceDetail(id) {
      let inv = invoices.find(i => i.id === id);
      if (!inv) return;
      document.getElementById('modalInvTitle').innerText = `${inv.firma} - Fatura Detayı`;
      let content = document.getElementById('modalInvContent');
      
      content.innerHTML = `
        <div class="space-y-3">
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 space-y-1">
            <div class="flex justify-between text-slate-300"><span>Mal Hizmet Toplam:</span><b>${inv.malHizmetToplami} TL</b></div>
            <div class="flex justify-between text-white font-bold text-sm pt-2 border-t border-slate-700"><span>Ödenecek Tutar:</span><span class="text-emerald-400">${inv.genelToplam} TL</span></div>
          </div>
          <div>
            <span class="font-bold text-white block mb-1">Fatura Kalemleri (Ürünler):</span>
            <table class="w-full text-left border-collapse text-[11px]">
              <thead>
                <tr class="border-b border-slate-700 text-slate-400">
                  <th class="p-2">Mal / Hizmet / Açıklama</th>
                  <th class="p-2 text-right">Toplam</th>
                </tr>
              </thead>
              <tbody>
                ${inv.kalemler.map(k => `
                  <tr class="border-b border-slate-800">
                    <td class="p-2 font-bold text-white">${k.ad}</td>
                    <td class="p-2 text-right font-bold text-emerald-400">${k.toplamTutar} ₺</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
      document.getElementById('invoiceModal').classList.remove('hidden');
    }

    function closeInvoiceModal() { document.getElementById('invoiceModal').classList.add('hidden'); }
    function toggleInvPaid(id) { let i = invoices.find(x => x.id === id); if(i){ i.isPaid = !i.isPaid; saveData(); renderInvoiceList(); } }
    function deleteInvoice(id) { invoices = invoices.filter(x => x.id !== id); saveData(); renderInvoiceList(); }

    function renderSuppliersView(c) { c.innerHTML = `<div class="text-slate-400">Tedarikçi carileri aktif.</div>`; }
    function renderStockView(c) { c.innerHTML = `<div class="text-slate-400">Stok modülü aktif.</div>`; }
    function renderStaffView(c) { c.innerHTML = `<div class="text-slate-400">Personel modülü aktif.</div>`; }
    function renderSalariesView(c) { c.innerHTML = `<div class="text-slate-400">Maaş modülü aktif.</div>`; }
    function renderReportsView(c) { c.innerHTML = `<div class="text-slate-400">Raporlar aktif.</div>`; }
  </script>
</body>
</html>
