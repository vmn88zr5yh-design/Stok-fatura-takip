<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSB POS Terminal</title>
  <style>
    body { background-color: #0c0f1d; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
    .header { background: #161e38; padding: 15px; border-radius: 14px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: #161e38; padding: 20px; border-radius: 16px; text-align: center; font-weight: bold; cursor: pointer; border: 1px solid #334155; font-size: 13px; }
    .card:active { background: #334155; }
    #panel { display: none; background: #161e38; padding: 15px; border-radius: 16px; border: 1px solid #334155; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 10px; box-sizing: border-box; }
    button.btn { background: #4f46e5; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .row { background: #0f172a; padding: 12px; border-radius: 10px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div style="font-weight:900; color:#f59e0b;">MENULUX POS</div>
      <div style="font-size:10px; color:#10b981;">KAHVE SARAYI AVCILAR</div>
    </div>
    <div style="text-align:right; font-size:11px;">
      <div style="font-weight:bold;">ALİ OSMAN BEY</div>
      <div style="color:#10b981;">● ONLINE</div>
    </div>
  </div>

  <div id="menu" class="grid">
    <div class="card" onclick="openMod('faturalar')">📸<br><br>Faturalar & AI</div>
    <div class="card" onclick="openMod('tedarik')">🏢<br><br>Tedarikçi Carileri</div>
    <div class="card" onclick="openMod('stoklar')">📦<br><br>Stok Yönetimi</div>
    <div class="card" onclick="openMod('personel')">👥<br><br>Personel & Maaş</div>
    <div class="card" onclick="openMod('raporlar')">📊<br><br>Ay Sonu Raporu</div>
    <div class="card" onclick="openMod('yoneticiler')">🛡️<br><br>Yönetici Paneli</div>
  </div>

  <div id="panel">
    <button style="background:#334155; color:#fff; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:bold;" onclick="closeMod()">⬅️ Ana Menü</button>
    <h3 id="pTitle" style="color:#f59e0b; margin-top:10px;"></h3>
    <div id="pBody"></div>
  </div>

  <script>
    let db = {
      invoices: JSON.parse(localStorage.getItem('ksb_inv_18') || '[]'),
      suppliers: JSON.parse(localStorage.getItem('ksb_sup_18') || '[{"name":"Kahve Sarayı","paid":false},{"name":"Uludağ İçecek","paid":false},{"name":"Leonaza Gıda","paid":false}]'),
      stocks: JSON.parse(localStorage.getItem('ksb_stk_18') || '[]'),
      staff: JSON.parse(localStorage.getItem('ksb_stf_18') || '[]'),
      managers: JSON.parse(localStorage.getItem('ksb_mgr_18') || '[{"name":"Ali Osman Bey","active":true}]'),
      apiKey: localStorage.getItem('ksb_key_18') || ''
    };

    function save() {
      localStorage.setItem('ksb_inv_18', JSON.stringify(db.invoices));
      localStorage.setItem('ksb_sup_18', JSON.stringify(db.suppliers));
      localStorage.setItem('ksb_stk_18', JSON.stringify(db.stocks));
      localStorage.setItem('ksb_stf_18', JSON.stringify(db.staff));
      localStorage.setItem('ksb_mgr_18', JSON.stringify(db.managers));
      localStorage.setItem('ksb_key_18', db.apiKey);
    }

    function openMod(name) {
      document.getElementById('menu').style.display = 'none';
      document.getElementById('panel').style.display = 'block';
      let t = document.getElementById('pTitle');
      let b = document.getElementById('pBody');

      if(name === 'faturalar') {
        t.innerText = 'Faturalar & AI Fotoğraf Okuma';
        b.innerHTML = `
          <input type="password" value="${db.apiKey}" placeholder="Gemini API Key (Opsiyonel)" onchange="db.apiKey=this.value;save();">
          <input type="file" accept="image/*" capture="environment" onchange="readAI(event)">
          <div id="aiStat" style="color:#f59e0b; font-size:11px; margin:5px 0;"></div>
          <input type="text" id="fSup" placeholder="Tedarikçi / Firma Adı">
          <input type="number" id="fSub" placeholder="Ara Toplam" oninput="calc()">
          <input type="number" id="fKdv" placeholder="KDV" oninput="calc()">
          <input type="number" id="fDisc" placeholder="İskonto" oninput="calc()">
          <div style="text-align:right; color:#10b981; font-weight:bold; margin:8px 0;">Net: <span id="fNet">0</span> TL</div>
          <button class="btn" onclick="saveInv()">Faturayı Kaydet & Cari Aç</button>
          <div id="fList" style="margin-top:10px;"></div>`;
        renderInvoices();
      } else if(name === 'tedarik') {
        t.innerText = 'Tedarikçi Carileri';
        b.innerHTML = `
          <input type="text" id="sName" placeholder="Tedarikçi Adı">
          <button class="btn" onclick="addSup()">Ekle</button>
          <div id="sList" style="margin-top:10px;"></div>`;
        renderSuppliers();
      } else if(name === 'stoklar') {
        t.innerText = 'Stok Yönetimi';
        b.innerHTML = `
          <input type="text" id="stName" placeholder="Ürün Adı">
          <input type="number" id="stQty" placeholder="Miktar">
          <button class="btn" onclick="addStk()">Stok Ekle</button>
          <div id="stList" style="margin-top:10px;"></div>`;
        renderStocks();
      } else if(name === 'personel') {
        t.innerText = 'Personel & Maaş';
        b.innerHTML = `
          <input type="text" id="pName" placeholder="Personel Adı">
          <input type="number" id="pSal" placeholder="Maaş (TL)">
          <button class="btn" onclick="addStaff()">Personel Ekle</button>
          <div id="pList" style="margin-top:10px;"></div>`;
        renderStaff();
      } else if(name === 'raporlar') {
        t.innerText = 'Ay Sonu Gider Raporu';
        let totInv = db.invoices.reduce((a,b)=>a+b.net,0);
        let totSal = db.staff.reduce((a,b)=>a+b.sal,0);
        b.innerHTML = `
          <div class="row">Toplam Fatura Gideri: <b style="color:#ec4899;">${totInv} TL</b></div>
          <div class="row">Toplam Maaş Gideri: <b style="color:#f59e0b;">${totSal} TL</b></div>
          <div class="row" style="background:#1e1b4b; margin-top:10px;"><b>AYLIK TOPLAM:</b> <b style="color:#10b981; font-size:15px;">${totInv+totSal} TL</b></div>`;
      } else if(name === 'yoneticiler') {
        t.innerText = 'Yönetici Paneli';
        b.innerHTML = `
          <input type="text" id="mName" placeholder="Yönetici Adı">
          <button class="btn" onclick="addMgr()">Yönetici Ekle</button>
          <div id="mList" style="margin-top:10px;"></div>`;
        renderManagers();
      }
    }

    function closeMod() {
      document.getElementById('menu').style.display = 'grid';
      document.getElementById('panel').style.display = 'none';
    }

    async function readAI(e) {
      let f = e.target.files[0];
      if(!f || !db.apiKey) return;
      let st = document.getElementById('aiStat');
      st.innerText = 'Yapay zeka faturayı okuyor...';
      let r = new FileReader();
      r.onload = async function() {
        let b64 = r.result.split(',')[1];
        try {
          let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${db.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [
              { text: 'Faturayı analiz et. JSON dön: {"supplier": "Ad", "subtotal": 0, "kdv": 0, "discount": 0}' },
              { inlineData: { mimeType: f.type, data: b64 } }
            ] }] })
          });
          let j = await res.json();
          let txt = j.candidates[0].content.parts[0].text.replace(/```json/g,'').replace(/```/g,'').trim();
          let p = JSON.parse(txt);
          document.getElementById('fSup').value = p.supplier || '';
          document.getElementById('fSub').value = p.subtotal || 0;
          document.getElementById('fKdv').value = p.kdv || 0;
          document.getElementById('fDisc').value = p.discount || 0;
          calc();
          st.innerText = 'Fatura başarıyla okundu!';
        } catch(err) { st.innerText = 'Okuma hatası.'; }
      };
      r.readAsDataURL(f);
    }

    function calc() {
      let sub = parseFloat(document.getElementById('fSub').value) || 0;
      let kdv = parseFloat(document.getElementById('fKdv').value) || 0;
      let disc = parseFloat(document.getElementById('fDisc').value) || 0;
      document.getElementById('fNet').innerText = sub + kdv - disc;
    }

    function saveInv() {
      let sup = document.getElementById('fSup').value.trim();
      let sub = parseFloat(document.getElementById('fSub').value) || 0;
      let kdv = parseFloat(document.getElementById('fKdv').value) || 0;
      let disc = parseFloat(document.getElementById('fDisc').value) || 0;
      let net = sub + kdv - disc;
      if(sup && net > 0) {
        if(!db.suppliers.some(s => s.name.toLowerCase() === sup.toLowerCase())) {
          db.suppliers.push({name: sup, paid: false});
        }
        db.invoices.push({sup, sub, kdv, disc, net});
        save(); renderInvoices(); alert('Kaydedildi ve cari açıldı!');
      }
    }

    function renderInvoices() {
      let el = document.getElementById('fList');
      if(el) el.innerHTML = db.invoices.map((x,i)=>`<div class="row"><b>${x.sup}</b><br><small>Ara: ${x.sub} | KDV: ${x.kdv} | İsk: ${x.disc}</small><br><b style="color:#10b981;">Net: ${x.net} TL</b> <button style="float:right; background:#7f1d1d; color:#fff; border:none; padding:3px 6px; border-radius:4px;" onclick="db.invoices.splice(${i},1);save();renderInvoices();">Sil</button></div>`).join('');
    }

    function addSup() {
      let name = document.getElementById('sName').value.trim();
      if(name) { db.suppliers.push({name, paid:false}); save(); renderSuppliers(); }
    }
    function renderSuppliers() {
      let el = document.getElementById('sList');
      if(el) el.innerHTML = db.suppliers.map((s,i)=>`<div class="row" style="display:flex; justify-content:space-between; align-items:center;"><b>${s.name}</b> <button style="background:${s.paid?'#065f46':'#7f1d1d'}; color:#fff; border:none; padding:5px 10px; border-radius:6px;" onclick="db.suppliers[${i}].paid=!db.suppliers[${i}].paid;save();renderSuppliers();">${s.paid?'Ödendi ✓':'Ödenmedi'}</button></div>`).join('');
    }

    function addStk() {
      let name = document.getElementById('stName').value.trim();
      let qty = parseFloat(document.getElementById('stQty').value) || 0;
      if(name) { db.stocks.push({name, qty}); save(); renderStocks(); }
    }
    function renderStocks() {
      let el = document.getElementById('stList');
      if(el) el.innerHTML = db.stocks.map((x,i)=>`<div class="row" style="display:flex; justify-content:space-between;"><span>${x.name} (${x.qty})</span> <button style="background:#7f1d1d; color:#fff; border:none; padding:3px 6px; border-radius:4px;" onclick="db.stocks.splice(${i},1);save();renderStocks();">Sil</button></div>`).join('');
    }

    function addStaff() {
      let name = document.getElementById('pName').value.trim();
      let sal = parseFloat(document.getElementById('pSal').value) || 0;
      if(name) { db.staff.push({name, sal, paid:false}); save(); renderStaff(); }
    }
    function renderStaff() {
      let el = document.getElementById('pList');
      if(el) el.innerHTML = db.staff.map((x,i)=>`<div class="row" style="display:flex; justify-content:space-between; align-items:center;"><span><b>${x.name}</b> (${x.sal} TL)</span> <button style="background:${x.paid?'#065f46':'#7f1d1d'}; color:#fff; border:none; padding:5px 10px; border-radius:6px;" onclick="db.staff[${i}].paid=!db.staff[${i}].paid;save();renderStaff();">${x.paid?'Ödendi ✓':'Bekliyor'}</button></div>`).join('');
    }

    function addMgr() {
      let name = document.getElementById('mName').value.trim();
      if(name) { db.managers.push({name, active:true}); save(); renderManagers(); }
    }
    function renderManagers() {
      let el = document.getElementById('mList');
      if(el) el.innerHTML = db.managers.map((x,i)=>`<div class="row" style="display:flex; justify-content:space-between; align-items:center;"><b>${x.name}</b> <button style="background:${x.active?'#78350f':'#065f46'}; color:#fff; border:none; padding:5px 10px; border-radius:6px;" onclick="db.managers[${i}].active=!db.managers[${i}].active;save();renderManagers();">${x.active?'Aktif':'Pasif'}</button></div>`).join('');
    }
  </script>
</body>
</html>
