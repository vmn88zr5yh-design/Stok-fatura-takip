<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KSB POS</title>

  <meta name="apple-mobile-web-app-title" content="KSB POS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%230d102b'/><circle cx='256' cy='256' r='200' fill='%23f59e0b'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='180' font-weight='900' fill='%230d102b'>KSB</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%230d102b'/><circle cx='256' cy='256' r='200' fill='%23f59e0b'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='180' font-weight='900' fill='%230d102b'>KSB</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d102b; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .pos-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: all 0.2s ease-in-out; }
    .pos-card:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.25); }
    .pos-card:active { transform: scale(0.98); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 select-none">

  <!-- Üst Bilgi Çubuğu -->
  <header class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-white/10 mb-4 sm:mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center font-black text-slate-950 text-sm tracking-tighter shadow-lg shadow-amber-500/20 border border-amber-200">
        KSB
      </div>
      <div>
        <div class="font-extrabold text-white text-sm tracking-wider flex items-center gap-1.5">
          KSB POS <span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.2 rounded border border-amber-500/30">v8.0 AI</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] text-slate-400">
          <span class="flex items-center gap-1 text-emerald-400 font-semibold">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Kamera / AI Hazır
          </span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3 text-right">
      <div class="text-xs">
        <div class="font-bold text-white tracking-wide">ALİ OSMAN BEY</div>
        <div class="text-[10px] text-slate-400">YÖNETİCİ</div>
      </div>
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-lg">AO</div>
    </div>
  </header>

  <!-- ANA DASHBOARD -->
  <main id="mainDashboard" class="flex-1 max-w-4xl mx-auto w-full flex flex-col justify-center my-auto">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5">
      
      <button onclick="openModule('faturalar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center shadow-lg shadow-pink-500/30 group-hover:scale-105 transition text-2xl">📸</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Fatura Fotoğrafı Okut (AI)</span>
      </button>

      <button onclick="openModule('cariler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition text-2xl">🏢</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Cari Borç Takibi</span>
      </button>

      <button onclick="openModule('stoklar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition text-2xl">📦</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Stok Yönetimi</span>
      </button>

      <button onclick="openModule('personel')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-105 transition text-2xl">👥</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Personel Listesi</span>
      </button>

      <button onclick="openModule('maaslar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/30 group-hover:scale-105 transition text-2xl">💰</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Maaş Takibi</span>
      </button>

      <button onclick="openModule('raporlar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-fuchsia-500 to-pink-600 flex items-center justify-center shadow-lg shadow-fuchsia-500/30 group-hover:scale-105 transition text-2xl">📊</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Ay Sonu Raporu</span>
      </button>

      <button onclick="openModule('yoneticiler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group col-span-2 sm:col-span-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow text-lg text-white">🛡️</div>
        <span class="font-bold text-xs text-indigo-200">Yönetici Yetki & Aktif/Pasif Paneli</span>
      </button>

    </div>
  </main>

  <!-- MODÜL EKRANI -->
  <section id="moduleContent" class="hidden flex-1 max-w-4xl mx-auto w-full bg-slate-900/90 rounded-3xl p-4 sm:p-6 border border-white/10 shadow-2xl flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
      <button onclick="closeModule()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2 border border-white/10">
        ⬅️ Ana Menü
      </button>
      <h2 id="moduleTitle" class="text-sm sm:text-base font-bold text-white">Modül Başlığı</h2>
    </div>
    <div id="moduleBody" class="flex-1 overflow-y-auto space-y-4 text-xs"></div>
  </section>

  <footer class="flex justify-between items-center text-[11px] text-slate-500 pt-3 border-t border-white/5">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-amber-400"></span>
      <span class="font-bold text-slate-400">KSB POS SYSTEM</span>
    </div>
    <div id="clockDisplay" class="font-bold text-slate-400">--:--</div>
  </footer>

  <script>
    let invoices = JSON.parse(localStorage.getItem('invoices_data')) || [];
    let suppliers = JSON.parse(localStorage.getItem('suppliers_data')) || [
      { name: 'Kahve Sarayı Tedarik', balance: 12500 },
      { name: 'Uludağ İçecek', balance: 4200 }
    ];
    let staffList = JSON.parse(localStorage.getItem('staff_data')) || [
      { id: 1, name: 'Barista Ahmet', role: 'Barista', salary: 25000, paid: false }
    ];
    let stockList = JSON.parse(localStorage.getItem('stock_data')) || [
      { id: 1, name: 'Espresso Çekirdeği (Kg)', amount: 15, unitPrice: 450 }
    ];
    let managers = JSON.parse(localStorage.getItem('managers_data')) || [
      { id: 1, name: 'Ali Osman Bey', email: 'ali@dukkan.com', role: 'Süper Admin', isAdmin: true, isActive: true },
      { id: 2, name: 'İskender Selçuk', email: 'aliosman.erol@icloud.com', role: 'Yönetici', isAdmin: true, isActive: true }
    ];
    let geminiApiKey = localStorage.getItem('gemini_api_key') || '';

    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      localStorage.setItem('invoices_data', JSON.stringify(invoices));
      localStorage.setItem('suppliers_data', JSON.stringify(suppliers));
      localStorage.setItem('staff_data', JSON.stringify(staffList));
      localStorage.setItem('stock_data', JSON.stringify(stockList));
      localStorage.setItem('managers_data', JSON.stringify(managers));
      localStorage.setItem('gemini_api_key', geminiApiKey);
    }

    function openModule(moduleName) {
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('moduleContent').classList.remove('hidden');
      const title = document.getElementById('moduleTitle');
      const body = document.getElementById('moduleBody');

      if (moduleName === 'faturalar') {
        title.innerText = '📸 Fatura Fotoğrafı Okut & AI Analiz';
        renderInvoicesView(body);
      } else if (moduleName === 'cariler') {
        title.innerText = '🏢 Cari & Tedarikçi Borç Takibi';
        renderSuppliersView(body);
      } else if (moduleName === 'stoklar') {
        title.innerText = '📦 Stok Yönetimi';
        renderStockView(body);
      } else if (moduleName === 'personel') {
        title.innerText = '👥 Personel Yönetimi';
        renderStaffView(body);
      } else if (moduleName === 'maaslar') {
        title.innerText = '💰 Maaş Ödeme Takibi';
        renderSalariesView(body);
      } else if (moduleName === 'raporlar') {
        title.innerText = '📊 Ay Sonu Otomatik Gider Raporu';
        renderReportsView(body);
      } else if (moduleName === 'yoneticiler') {
        title.innerText = '🛡️ Yönetici Yetki & Aktif/Pasif Paneli';
        renderManagersView(body);
      }
    }

    function closeModule() {
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('moduleContent').classList.add('hidden');
    }

    // --- 1. KAMERA / FOTOĞRAF İLE FATURA OKUTMA (GEMINI AI) ---
    function renderInvoicesView(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-4 rounded-2xl border border-white/10 space-y-3">
          <span class="font-bold text-white block">Gemini API Key (İlk kurulum için gerekli):</span>
          <div class="flex gap-2">
            <input type="password" id="apiKeyInput" value="${geminiApiKey}" placeholder="AI Studio API Anahtarınızı Girin" class="flex-1 bg-slate-900 p-2 rounded-xl text-white border border-slate-700 text-xs">
            <button onclick="saveApiKey()" class="bg-indigo-600 px-3 py-2 rounded-xl font-bold text-white">Kaydet</button>
          </div>
        </div>

        <div class="bg-slate-800 p-4 rounded-2xl border border-white/10 space-y-3">
          <span class="font-bold text-white block">Fatura Fotoğrafı Çek veya Galeriden Yükle:</span>
          <input type="file" id="invoiceImageFile" accept="image/*" capture="environment" class="w-full bg-slate-900 text-slate-300 p-2.5 rounded-xl border border-slate-700">
          <button onclick="processInvoiceWithAI()" class="w-full bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 font-bold py-3 rounded-xl text-white shadow-lg">📸 Fotoğrafı AI ile Analiz Et & Oku</button>
          <div id="aiStatus" class="text-center text-amber-400 font-semibold"></div>
        </div>

        <div class="bg-slate-800 p-4 rounded-2xl border border-white/10 space-y-3">
          <span class="font-bold text-white block">Okunan / Düzenlenen Fatura Bilgileri:</span>
          <input type="text" id="invSup" placeholder="Tedarikçi / Firma Adı" class="w-full bg-slate-900 p-2.5 rounded-xl text-white border border-slate-700">
          <div class="grid grid-cols-3 gap-2">
            <input type="number" id="invSubtotal" placeholder="Ara Toplam" class="bg-slate-900 p-2.5 rounded-xl text-white border border-slate-700">
            <input type="number" id="invKdv" placeholder="KDV" class="bg-slate-900 p-2.5 rounded-xl text-white border border-slate-700">
            <input type="number" id="invDiscount" placeholder="İskonto" class="bg-slate-900 p-2.5 rounded-xl text-white border border-slate-700">
          </div>
          <button onclick="addInvoice()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl text-white">Onayla ve Carilere/Giderlere İşle</button>
        </div>

        <div class="space-y-2 pt-2">
          <span class="font-bold text-slate-400 block">Kayıtlı Faturalar:</span>
          <div id="invList" class="space-y-2"></div>
        </div>
      `;
      renderInvoiceList();
    }

    function saveApiKey() {
      geminiApiKey = document.getElementById('apiKeyInput').value.trim();
      saveData();
      alert('API Anahtarı kaydedildi!');
    }

    async function processInvoiceWithAI() {
      const fileInput = document.getElementById('invoiceImageFile');
      const statusDiv = document.getElementById('aiStatus');
      if (!geminiApiKey) {
        alert('Lütfen önce üst kısma Gemini API anahtarınızı girip kaydedin!');
        return;
      }
      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Lütfen önce kameradan bir fotoğraf çekin veya galeriden fatura seçin!');
        return;
      }

      statusDiv.innerText = '🤖 Yapay zeka faturayı tarıyor, lütfen bekleyin...';
      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function() {
        const base64Data = reader.result.split(',')[1];
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "Bu fatura görselini analiz et. Sadece şu JSON formatında yanıt ver (başka hiçbir açıklama yazma): {\"supplier\": \"Firma Adı\", \"subtotal\": 0.0, \"kdv\": 0.0, \"discount\": 0.0, \"total\": 0.0}" },
                  { inlineData: { mimeType: file.type, data: base64Data } }
                ]
              }]
            })
          });

          const result = await response.json();
          const textResponse = result.candidates[0].content.parts[0].text;
          const cleanJson = textResponse.replace(/```json/g, '').replace(/
