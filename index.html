<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KSB POS - Terminal</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0c0f1d; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 12px; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 12px 16px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.08); }
    .brand { font-weight: 900; font-size: 16px; color: #f59e0b; letter-spacing: 0.5px; }
    .sub-brand { font-size: 10px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 700px; margin: auto; width: 100%; flex: 1; align-content: center; }
    @media(min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    
    .pos-card { background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,255,255,0.08); padding: 22px 15px; border-radius: 20px; text-align: center; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .pos-card:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
    .pos-icon { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    .pos-title { font-weight: bold; font-size: 13px; color: #f8fafc; }

    #modulePanel { display: none; background: #161e38; border-radius: 20px; padding: 16px; flex: 1; max-width: 700px; margin: auto; width: 100%; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .back-btn { background: #334155; color: white; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 12px; margin-bottom: 12px; }
    
    input, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; margin-top: 6px; margin-bottom: 10px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: #f59e0b; }
    .btn { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 5px; font-size: 13px; box-shadow: 0 4px 12px rgba(79,70,229,0.4); }
    
    .item-card { background: #0f172a; padding: 14px; border-radius: 14px; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 6px; }
    .row-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    footer { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; font-size: 11px; color: #64748b; max-width: 700px; margin: auto; width: 100%; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand">MENULUX POS <span style="font-size:10px; color:#f59e0b; background:rgba(245,158,11,0.15); padding:2px 6px; border-radius:6px;">KAHVE SARAYI AVCILAR</span></div>
      <div class="sub-brand" id="dateClock">16 Eylül Çarşamba • --:--</div>
    </div>
    <div style="text-align:right;">
      <div style="font-weight:bold; font-size:12px; color:#fff;">ALİ OSMAN BEY</div>
      <div style="font-size:10px; color:#10b981;">● ÖDEME NOKTASI ONLINE</div>
    </div>
  </header>

  <div id="mainGrid" class="grid">
    <div class="pos-card" onclick="openModule('faturalar')">
      <div class="pos-icon" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">📸</div>
      <div class="pos-title">Faturalar (KDV, İskonto, Fotoğraf)</div>
    </div>
    <div class="pos-card" onclick="openModule('tedarik')">
      <div class="pos-icon" style="background: linear-gradient(135deg, #3b82f6, #06b6d4);">🏢</div>
      <div class="pos-title">Tedarikçi Carileri</div>
    </div>
    <div class="pos-card" onclick="openModule('stoklar')">
      <div class="pos-icon" style="background: linear-gradient(135deg, #8b5cf6, #6366f1);">📦</div>
      <div class="pos-title">Stok Yönetimi</div>
    </div>
    <div class="pos-card" onclick="openModule('personel')">
      <div class="pos-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">👥</div>
      <div class="pos-title">Personel & Maaş</div>
    </div>
    <div class="pos-card" onclick="openModule('raporlar')">
      <div class="pos-icon" style="background: linear-gradient(135deg, #10b981, #059669);">📊</div>
      <div class="pos-title">Ay Sonu Raporu</div>
    </div>
    <div class="pos-card" onclick="openModule('yoneticiler')">
      <div class="pos-icon" style="background: linear-gradient(135deg, #6366f1, #4338ca);">🛡️</div>
      <div class="pos-title">Yönetici Paneli</div>
    </div>
  </div>

  <div id="modulePanel">
    <button class="back-btn" onclick="closeModule()">⬅️ Ana Menüye Dön</button>
    <h3 id="panelTitle" style="margin: 0 0 12px 0; color: #f59e0b; font-size: 15px;"></h3>
    <div id="panelBody"></div>
  </div>

  <footer>
    <div>KSB POS TERMINAL v17.0</div>
    <div>🔒 Güvenli Bağlantı</div>
  </footer>

  <script>
    let db = {
      invoices: JSON.parse(localStorage.getItem('ksb_inv_17') || '[]'),
      suppliers: JSON.parse(localStorage.getItem('ksb_sup_17') || '[{"name":"Kahve Sarayı Tedarik","paid":false},{"name":"Uludağ İçecek","paid":false},{"name":"Leonaza Gıda","paid":false}]'),
      stocks: JSON.parse(localStorage.getItem('ksb_stk_17') || '[]'),
      staff: JSON.parse(localStorage.getItem('ksb_stf_17') || '[]'),
      managers: JSON.parse(localStorage.getItem('ksb_mgr_17') || '[{"name":"Ali Osman Bey","active":true}]'),
      apiKey: localStorage.getItem('ksb_gemini_key_17') || ''
    };

    function sync() {
      localStorage.setItem('ksb_inv_17', JSON.stringify(db.invoices));
      localStorage.setItem('ksb_sup_17', JSON.stringify(db.suppliers));
      localStorage.setItem('ksb_stk_17', JSON.stringify(db.stocks));
      localStorage.setItem('ksb_stf_17', JSON.stringify(db.staff));
      localStorage.setItem('ksb_mgr_17', JSON.stringify(db.managers));
      localStorage.setItem('ksb_gemini_key_17', db.apiKey);
    }

    setInterval(() => {
      let now = new Date();
      let timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      document.getElementById('dateClock').innerText = `16 Eylül Çarşamba • ${timeStr}`;
    }, 1000);

    function openModule(name) {
      document.getElementById('mainGrid').style.display = 'none';
      document.getElementById('modulePanel').style.display = 'block';
      let title = document.getElementById('panelTitle');
      let body = document.getElementById('panelBody');

      if(name === 'faturalar') {
        title.innerText = '📸 Fatura Fotoğrafı Yükle & AI Otomatik Oku';
        body.innerHTML = `
          <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:10px; margin-bottom:10px;">
            <label style="font-size:11px; color:#94a3b8;">Gemini API Anahtarı (AI Otomatik Okuma İçin):</label>
            <input type="password" id="apiKey" value="${db.apiKey}" placeholder="API Key girin..." onchange="db.apiKey=this.value; sync();">
          </div>
          <div style="border: 2px dashed #334155; padding:15px; border-radius:14px; text-align:center; background:rgba(0,0,0,0.2);">
            <p style="margin:0 0 8px 0; font-size:12px; color:#cbd5e1;">Fatura Fotoğrafı Çek veya Galeriden Seç:</p>
            <input type="file" id="invPhoto" accept="image/*" capture="environment" onchange="handleImageUpload(event)" style="font-size:11px;">
          </div>
          <div id="loadingStatus" style="text-align:center; color:#f59e0b; font-weight:bold; margin:8px 0; font-size:12px;"></div>
          
          <div style="margin-top:10px;">
            <input type="text" id="fSup" placeholder="Tedarikçi / Firma Adı (Fotoğraftan otomatik açılır)">
            <div style="display:flex; gap:8px;">
              <input type="number" id="fSub" placeholder="Ara Toplam" oninput="calcNet()">
              <input type="number" id="fKdv" placeholder="KDV" oninput="calcNet()">
            </div>
            <input type="number" id="fDisc" placeholder="İskonto" oninput="calcNet()">
            <div style="text-align:right; color:#10b981; font-weight:bold; margin:6px 0; font-size:13px;">Net Tutar: <span id="fNet">0</span> TL</div>
            <button class="btn" onclick="saveInvoice()">Faturayı Kaydet & Otomatik Cari Aç</button>
          </div>
          <div id="invList" style="margin-top:15px;"></div>
        `;
        renderInvoices();
      } else if(name === 'tedarik') {
        title.innerText = '🏢 Tedarikçi Carileri & Ödeme Durumları';
        body.innerHTML = `
          <div style="display:flex; gap:8px;">
            <input type="text" id="newSup" placeholder="Yeni Tedarikçi Adı">
            <button class="btn" style="margin-top:6px; width:100px;" onclick="addSupplierDirect()">Ekle</button>
          </div>
          <div id="supList" style="margin-top:12px;"></div>
        `;
        renderSuppliers();
      } else if(name === 'stoklar') {
        title.innerText = '📦 Stok Yönetimi';
        body.innerHTML = `
          <input type="text" id="stName" placeholder="Ürün Adı">
          <input type="number" id="stQty" placeholder="Miktar">
          <button class="btn" onclick="addStock()">Stok Ekle</button>
          <div id="stList" style="margin-top:12px;"></div>
        `;
        renderStocks();
      } else if(name === 'personel') {
        title.innerText = '👥 Personel & Maaş Ödeme Takibi';
        body.innerHTML = `
          <input type="text" id="pName" placeholder="Personel Adı">
          <input type="number" id="pSal" placeholder="Maaş (TL)">
          <button class="btn" onclick="addStaff()">Personel Ekle</button>
          <div id="pList" style="margin-top:12px;"></div>
        `;
        renderStaff();
      } else if(name === 'raporlar') {
        title.innerText = '📊 Ay Sonu Gider Raporu';
        let totInv = db.invoices.reduce((a,b)=>a+b.net,0);
        let totSal = db.staff.reduce((a,b)=>a+b.sal,0);
        body.innerHTML = `
          <div class="item-card"><div class="row-flex"><span>Toplam Fatura Gideri:</span><b style="color:#ec4899;">${totInv} TL</b></div></div>
          <div class="item-card"><div class="row-flex"><span>Toplam Maaş Gideri:</span><b style="color:#f59e0b;">${totSal} TL</b></div></div>
          <div class="item-card" style="background:#1e1b4b; border-color:#4338ca;"><div class="row-flex"><span style="color:#fff; font-weight:bold;">AYLIK TOPLAM GİDER:</span><b style="color:#10b981; font-size:16px;">${totInv+totSal} TL</b></div></div>
        `;
      } else if(name === 'yoneticiler') {
        title.innerText = '🛡️ Yönetici Yetki Paneli';
        body.innerHTML = `
          <input type="text" id="mName" placeholder="Yönetici Adı">
          <button class="btn" onclick="addManager()">Yönetici Ekle</button>
          <div id="mList" style="margin-top:12px;"></div>
        `;
        renderManagers();
      }
    }

    function closeModule() {
      document.getElementById('mainGrid').style.display = 'grid';
      document.getElementById('modulePanel').style.display = 'none';
    }

    async function handleImageUpload(event) {
      let file = event.target.files[0];
      if(!file) return;
      let status = document.getElementById('loadingStatus');
      
      if(!db.apiKey) {
        status.innerText = '⚠️ API Key girilmedi. Bilgileri elle kontrol edip kaydedebilirsiniz.';
        return;
      }

      status.innerText = '🤖 Fatura yapay zeka ile taranıyor...';
      let reader = new FileReader();
      reader.onload = async function() {
        let base64Data = reader.result.split(',')[1];
        try {
          let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${db.apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "Bu fatura görselini analiz et. Sadece şu JSON formatında yanıt ver (başka yazı yazma): {\"supplier\": \"Firma Adı\", \"subtotal\": 0.0, \"kdv\": 0.0, \"discount\": 0.0, \"total\": 0.0}" },
                  { inlineData: { mimeType: file.type, data: base64Data } }
                ]
              }]
            })
          });
          let data = await res.json();
          let jsonText = data.candidates[0].content.parts[0].text.replace(/```json/g,'').replace(/```/g,'').trim();
          let parsed = JSON.parse(jsonText);

          document.getElementById('fSup').value = parsed.supplier || '';
          document.getElementById('fSub').value = parsed.subtotal || 0;
          document.getElementById('fKdv').value = parsed.kdv || 0;
          document.getElementById('fDisc').value = parsed.discount || 0;
          calcNet();
          status.innerText = '✅ Fatura okundu, yeni cari otomatik oluşturulmaya hazır!';
        } catch(e) {
          status.innerText = '❌ Okuma hatası oluştu.';
        }
      };
      reader.readAsDataURL(file);
    }

    function calcNet() {
      let sub = parseFloat(document.getElementById('fSub').value) || 0;
      let kdv = parseFloat(document.getElementById('fKdv').value) || 0;
      let disc = parseFloat(document.getElementById('fDisc').value) || 0;
      document.getElementById('fNet').innerText = sub + kdv - disc;
    }

    function saveInvoice() {
      let supName = document.getElementById('fSup').value.trim();
      let sub = parseFloat(document.getElementById('fSub').value) || 0;
      let kdv = parseFloat(document.getElementById('fKdv').value) || 0;
      let disc = parseFloat(document.getElementById('fDisc').value) || 0;
      let net = sub + kdv - disc;

      if(supName && net > 0) {
        let existingSup = db.suppliers.find(s => s.name.toLowerCase() === supName.toLowerCase());
        if(!existingSup) {
          db.suppliers.push({ name: supName, paid: false });
        }

        db.invoices.push({ sup: supName, sub, kdv, disc, net, date: new Date().toLocaleDateString() });
        sync();
        renderInvoices();
        alert(`Fatura kaydedildi ve "${supName}" için ayrı cari hesap açıldı!`);
      } else {
        alert('Lütfen firma adı ve tutarları girin.');
      }
    }

    function renderInvoices() {
      let d = document.getElementById('invList');
      if(d) {
        d.innerHTML = db.invoices.map((x,i)=>`
          <div class="item-card">
            <div class="row-flex"><b>🏢 ${x.sup}</b> <button style="background:#7f1d1d; color:#fff; border:none; padding:3px 8px; border-radius:6px; font-size:10px;" onclick="db.invoices.splice(${i},1); sync(); renderInvoices();">Sil</button></div>
            <div style="font-size:11px; color:#94a3b8;">Ara: ${x.sub}₺ | KDV: ${x.kdv}₺ | İsk: ${x.disc}₺</div>
            <div style="font-size:12px; color:#10b981; font-weight:bold;">Net Tutar: ${x.net} TL (${x.date})</div>
          </div>`).join('');
      }
    }

    function addSupplierDirect() {
      let name = document.getElementById('newSup').value.trim();
      if(name) {
        db.suppliers.push({ name, paid: false });
        sync(); renderSuppliers();
        document.getElementById('newSup').value = '';
      }
    }

    function renderSuppliers() {
      let d = document.getElementById('supList');
      if(d) {
        d.innerHTML = db.suppliers.map((s, idx) => {
          let supInvoices = db.invoices.filter(inv => inv.sup === s.name);
          let totalDebt = supInvoices.reduce((sum, inv) => sum + inv.net, 0);
          return `
            <div class="item-card">
              <div class="row-flex">
                <b style="color:#f59e0b;">🏢 ${s.name}</b>
                <button style="background:${s.paid?'#065f46':'#7f1d1d'}; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-weight:bold; font-size:11px;" onclick="db.suppliers[${idx}].paid=!db.suppliers[${idx}].paid; sync(); renderSuppliers();">
                  ${s.paid ? 'Ödendi ✓' : 'Ödenmedi'}
                </button>
              </div>
              <div style="font-size:12px; color:#cbd5e1;">Toplam Borç: <b>${totalDebt} TL</b></div>
              <div class="row-flex" style="font-size:10px; color:#64748b; border-top:1px solid rgba(255,255,255,0.05); padding-top:4px; margin-top:4px;">
                <span>Fatura Adedi: ${supInvoices.length}</span>
                <button style="background:#7f1d1d; color:#fff; border:none; padding:2px 6px; border-radius:4px; font-size:10px;" onclick="db.suppliers.splice(${idx},1); sync(); renderSuppliers();">Cariyi Sil</button>
              </div>
            </div>`;
        }).join('');
      }
    }

    function addStock() {
      let name = document.getElementById('stName').value.trim();
      let qty = parseFloat(document.getElementById('stQty').value) || 0;
      if(name) { db.stocks.push({name, qty}); sync(); renderStocks(); }
    }
    function renderStocks() {
      let d = document.getElementById('stList');
      if(d) d.innerHTML = db.stocks.map((x,i)=>`<div class="item-card"><div class="row-flex"><span>${x.name} - <b>${x.qty}</b></span><button style="background:#7f1d1d; color:#fff; border:none; padding:3px 8px; border-radius:6px; font-size:10px;" onclick="db.stocks.splice(${i},1); sync(); renderStocks();">Sil</button></div></div>`).join('');
    }

    function addStaff() {
      let name = document.getElementById('pName').value.trim();
      let sal = parseFloat(document.getElementById('pSal').value) || 0;
      if(name) { db.staff.push({name, sal, paid:false}); sync(); renderStaff(); }
    }
    function renderStaff() {
      let d = document.getElementById('pList');
      if(d) d.innerHTML = db.staff.map((x,i)=>`
        <div class="item-card">
          <div class="row-flex">
            <span><b>${x.name}</b> (${x.sal} TL)</span>
            <button style="background:${x.paid?'#065f46':'#7f1d1d'}; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:11px;" onclick="db.staff[${i}].paid=!db.staff[${i}].paid; sync(); renderStaff();">
              ${x.paid ? 'Ödendi ✓' : 'Bekliyor'}
            </button>
          </div>
        </div>`).join('');
    }

    function addManager() {
      let name = document.getElementById('mName').value.trim();
      if(name) { db.managers.push({name, active:true}); sync(); renderManagers(); }
    }
    function renderManagers() {
      let d = document.getElementById('mList');
      if(d) d.innerHTML = db.managers.map((x,i)=>`
        <div class="item-card">
          <div class="row-flex">
            <span><b>${x.name}</b></span>
            <button style="background:${x.active?'#78350f':'#065f46'}; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:11px;" onclick="db.managers[${i}].active=!db.managers[${i}].active; sync(); renderManagers();">
              ${x.active ? 'Aktif' : 'Pasif'}
            </button>
          </div>
        </div>`).join('');
    }
  </script>
</body>
</html>
