<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSB POS</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0d102b; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #1e293b; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 600px; margin: auto; width: 100%; }
    @media(min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; text-align: center; color: white; cursor: pointer; font-weight: bold; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .card:active { background: rgba(255,255,255,0.15); transform: scale(0.97); }
    .full { grid-column: span 2; }
    @media(min-width: 640px) { .full { grid-column: span 3; } }
    #moduleContent { display: none; background: #1e293b; border-radius: 20px; padding: 20px; flex: 1; max-width: 600px; margin: auto; width: 100%; border: 1px solid rgba(255,255,255,0.1); }
    .btn { background: #4f46e5; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 14px; }
    input, select { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; margin-top: 5px; margin-bottom: 10px; font-size: 14px; }
    .item-row { background: #0f172a; padding: 12px; border-radius: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
    .back-btn { background: #334155; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

  <header>
    <div>
      <div style="font-weight:900; font-size:16px; color:#f59e0b;">KSB POS <span style="font-size:10px; color:#94a3b8;">v14.0</span></div>
      <div style="font-size:11px; color:#10b981;">● Sistem Kararlı</div>
    </div>
    <div style="text-align:right;">
      <div style="font-weight:bold; font-size:12px;">ALİ OSMAN BEY</div>
      <div style="font-size:10px; color:#94a3b8;">YÖNETİCİ</div>
    </div>
  </header>

  <!-- ANA MENÜ -->
  <div id="mainDashboard" class="grid">
    <div class="card" onclick="openModule('faturalar')">
      <span style="font-size:28px;">📸</span>
      <span>Fatura & Detaylar</span>
    </div>
    <div class="card" onclick="openModule('tedarikciler')">
      <span style="font-size:28px;">🏢</span>
      <span>Tedarikçi Carileri</span>
    </div>
    <div class="card" onclick="openModule('stoklar')">
      <span style="font-size:28px;">📦</span>
      <span>Stok Yönetimi</span>
    </div>
    <div class="card" onclick="openModule('personel')">
      <span style="font-size:28px;">👥</span>
      <span>Personel Listesi</span>
    </div>
    <div class="card" onclick="openModule('maaslar')">
      <span style="font-size:28px;">💰</span>
      <span>Maaş Takibi</span>
    </div>
    <div class="card" onclick="openModule('raporlar')">
      <span style="font-size:28px;">📊</span>
      <span>Ay Sonu Raporu</span>
    </div>
    <div class="card full" onclick="openModule('yoneticiler')">
      <span style="font-size:22px;">🛡️</span>
      <span>Yönetici Yetki Paneli</span>
    </div>
  </div>

  <!-- MODÜL EKRANI -->
  <div id="moduleContent">
    <button class="back-btn" onclick="closeModule()">⬅️ Ana Menüye Dön</button>
    <h3 id="moduleTitle" style="margin-top:0; color:#f59e0b; font-size:16px;"></h3>
    <div id="moduleBody"></div>
  </div>

  <footer style="text-align:center; font-size:11px; color:#64748b; margin-top:20px;">
    KSB POS SYSTEM &bull; <span id="clock">--:--</span>
  </footer>

  <script>
    // Güvenli LocalStorage Veri Yükleme
    function loadData(key, def) {
      try {
        let val = localStorage.getItem(key);
        return val ? JSON.parse(val) : def;
      } catch(e) { return def; }
    }

    let invoices = loadData('ksb_inv_14', []);
    let suppliers = loadData('ksb_sup_14', [
      { id: 1, name: 'Kahve Sarayı Tedarik', paid: false },
      { id: 2, name: 'Uludağ İçecek', paid: false },
      { id: 3, name: 'Leonaza Gıda', paid: false }
    ]);
    let staff = loadData('ksb_stf_14', [{ id: 1, name: 'Barista Ahmet', role: 'Barista', salary: 25000, paid: false }]);
    let stocks = loadData('ksb_stk_14', [{ id: 1, name: 'Espresso (Kg)', amount: 15, unitPrice: 450 }]);
    let managers = loadData('ksb_mgr_14', [{ id: 1, name: 'Ali Osman Bey', email: 'ali@dukkan.com', active: true }]);

    setInterval(() => {
      let d = new Date();
      let el = document.getElementById('clock');
      if(el) el.innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      try {
        localStorage.setItem('ksb_inv_14', JSON.stringify(invoices));
        localStorage.setItem('ksb_sup_14', JSON.stringify(suppliers));
        localStorage.setItem('ksb_stf_14', JSON.stringify(staff));
        localStorage.setItem('ksb_stk_14', JSON.stringify(stocks));
        localStorage.setItem('ksb_mgr_14', JSON.stringify(managers));
      } catch(e) {}
    }

    function openModule(name) {
      document.getElementById('mainDashboard').style.display = 'none';
      document.getElementById('moduleContent').style.display = 'block';
      let title = document.getElementById('moduleTitle');
      let body = document.getElementById('moduleBody');

      if(name === 'faturalar') {
        title.innerText = '📸 Fatura Ekle (KDV, İskonto Detaylı)';
        let supOptions = suppliers.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        body.innerHTML = `
          <select id="iSup">${supOptions}</select>
          <div style="display:flex; gap:10px;">
            <input type="number" id="iSub" placeholder="Ara Toplam (TL)" oninput="calcTotal()">
            <input type="number" id="iKdv" placeholder="KDV (TL)" oninput="calcTotal()">
          </div>
          <input type="number" id="iDisc" placeholder="İskonto (TL)" oninput="calcTotal()">
          <div style="background:#0f172a; padding:10px; border-radius:8px; margin-bottom:10px; text-align:right; font-weight:bold; color:#10b981;">
            Hesaplanan Net Tutar: <span id="calcNet">0</span> TL
          </div>
          <button class="btn" onclick="window.addInv()">Faturayı Tedarikçiye Kaydet</button>
          <div id="iList" style="margin-top:15px;"></div>
        `;
        renderInvList();
      } else if(name === 'tedarikciler') {
        title.innerText = '🏢 Tedarikçi Carileri & Ödeme Durumları';
        body.innerHTML = `
          <div style="display:flex; gap:10px;">
            <input type="text" id="newSupName" placeholder="Yeni Tedarikçi Adı">
            <button class="btn" style="margin-top:5px; width:100px;" onclick="window.addSupplier()">Ekle</button>
          </div>
          <div id="supList" style="margin-top:15px;"></div>
        `;
        renderSupList();
      } else if(name === 'stoklar') {
        title.innerText = '📦 Stok Yönetimi';
        body.innerHTML = `
          <input type="text" id="stName" placeholder="Ürün Adı">
          <div style="display:flex; gap:10px;">
            <input type="number" id="stAmt" placeholder="Miktar">
            <input type="number" id="stPrice" placeholder="Birim Fiyat">
          </div>
          <button class="btn" onclick="window.addStk()">Stok Kalemi Ekle</button>
          <div id="stList" style="margin-top:15px;"></div>
        `;
        renderStkList();
      } else if(name === 'personel') {
        title.innerText = '👥 Personel Listesi';
        body.innerHTML = `
          <input type="text" id="pName" placeholder="Personel Adı">
          <div style="display:flex; gap:10px;">
            <input type="text" id="pRole" placeholder="Görevi">
            <input type="number" id="pSal" placeholder="Maaş (TL)">
          </div>
          <button class="btn" onclick="window.addStaff()">Personel Kaydet</button>
          <div id="pList" style="margin-top:15px;"></div>
        `;
        renderStaffList();
      } else if(name === 'maaslar') {
        title.innerText = '💰 Maaş Takibi (Ödendi / Bekliyor)';
        body.innerHTML = `<div id="salList"></div>`;
        renderSalList();
      } else if(name === 'raporlar') {
        title.innerText = '📊 Ay Sonu Gider Raporu';
        let tInv = invoices.reduce((a,b)=>a+b.net,0);
        let tSal = staff.reduce((a,b)=>a+b.salary,0);
        body.innerHTML = `
          <div class="item-row"><span>Toplam Fatura Gideri:</span> <b style="color:#ec4899;">${tInv} TL</b></div>
          <div class="item-row"><span>Toplam Maaş Gideri:</span> <b style="color:#f59e0b;">${tSal} TL</b></div>
          <div class="item-row" style="background:#312e81; margin-top:15px;"><span>AYLIK TOPLAM GİDER:</span> <b style="color:#10b981; font-size:16px;">${tInv+tSal} TL</b></div>
        `;
      } else if(name === 'yoneticiler') {
        title.innerText = '🛡️ Yönetici Yetki Paneli';
        body.innerHTML = `
          <input type="text" id="mName" placeholder="Ad Soyad">
          <input type="email" id="mMail" placeholder="E-posta">
          <button class="btn" onclick="window.addMgr()">Yönetici Ekle</button>
          <div id="mList" style="margin-top:15px;"></div>
        `;
        renderMgrList();
      }
    }

    function closeModule() {
      document.getElementById('mainDashboard').style.display = 'grid';
      document.getElementById('moduleContent').style.display = 'none';
    }

    window.calcTotal = function() {
      let sub = parseFloat(document.getElementById('iSub').value) || 0;
      let kdv = parseFloat(document.getElementById('iKdv').value) || 0;
      let disc = parseFloat(document.getElementById('iDisc').value) || 0;
      let net = sub + kdv - disc;
      let el = document.getElementById('calcNet');
      if(el) el.innerText = net;
    }

    window.addInv = function() {
      let sup = document.getElementById('iSup').value;
      let sub = parseFloat(document.getElementById('iSub').value) || 0;
      let kdv = parseFloat(document.getElementById('iKdv').value) || 0;
      let disc = parseFloat(document.getElementById('iDisc').value) || 0;
      let net = sub + kdv - disc;
      if(sup && net > 0) {
        invoices.push({ sup, sub, kdv, disc, net, date: new Date().toLocaleDateString() });
        saveData(); renderInvList(); alert('Fatura kaydedildi!');
      } else { alert('Lütfen tutarları eksiksiz girin.'); }
    }

    function renderInvList() {
      let d = document.getElementById('iList');
      if(d) {
        d.innerHTML = invoices.map((x,i)=>`
          <div class="item-row" style="flex-direction:column; align-items:flex-start; gap:4px;">
            <div style="display:flex; justify-content:space-between; width:100%;">
              <b>${x.sup}</b>
              <button style="background:#7f1d1d; color:#fca5a5; border:none; padding:3px 8px; border-radius:5px;" onclick="window.delInv(${i})">Sil</button>
            </div>
            <div style="font-size:11px; color:#94a3b8;">Ara: ${x.sub}₺ | KDV: ${x.kdv}₺ | İsk: ${x.disc}₺</div>
            <div style="font-size:12px; color:#10b981; font-weight:bold;">Net Tutar: ${x.net} TL (${x.date})</div>
          </div>`).join('');
      }
    }
    window.delInv = function(i) { invoices.splice(i,1); saveData(); renderInvList(); }

    window.addSupplier = function() {
      let name = document.getElementById('newSupName').value.trim();
      if(name) {
        suppliers.push({ id: Date.now(), name, paid: false });
        saveData(); renderSupList();
        document.getElementById('newSupName').value = '';
      }
    }

    function renderSupList() {
      let d = document.getElementById('supList');
      if(d) {
        d.innerHTML = suppliers.map((s, idx) => {
          let supInvoices = invoices.filter(inv => inv.sup === s.name);
          let totalDebt = supInvoices.reduce((sum, inv) => sum + inv.net, 0);
          return `
            <div class="item-row" style="flex-direction:column; align-items:flex-start; gap:8px;">
              <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                <b style="font-size:14px; color:#f59e0b;">🏢 ${s.name}</b>
                <button style="background:${s.paid?'#065f46':'#7f1d1d'}; color:${s.paid?'#6ee7b7':'#fca5a5'}; border:none; padding:5px 10px; border-radius:6px; font-weight:bold; font-size:11px;" onclick="window.toggleSup(${s.id})">
                  ${s.paid ? 'Ödendi ✓' : 'Ödenmedi'}
                </button>
              </div>
              <div style="font-size:12px; color:#cbd5e1;">Toplam Fatura Borcu: <b>${totalDebt} TL</b></div>
              <div style="font-size:10px; color:#64748b; width:100%; border-top:1px solid rgba(255,255,255,0.05); padding-top:4px; display:flex; justify-content:space-between; align-items:center;">
                <span>Fatura Adedi: ${supInvoices.length}</span>
                <button style="background:#7f1d1d; color:#fca5a5; border:none; padding:2px 6px; border-radius:4px; font-size:10px;" onclick="window.delSup(${s.id})">Cariyi Sil</button>
              </div>
            </div>`;
        }).join('');
      }
    }
    window.toggleSup = function(id) { let s = suppliers.find(x=>x.id===id); if(s) { s.paid=!s.paid; saveData(); renderSupList(); } }
    window.delSup = function(id) { suppliers=suppliers.filter(x=>x.id!==id); saveData(); renderSupList(); }

    window.addStk = function() {
      let name = document.getElementById('stName').value.trim();
      let amount = parseFloat(document.getElementById('stAmt').value) || 0;
      let unitPrice = parseFloat(document.getElementById('stPrice').value) || 0;
      if(name) { stocks.push({id:Date.now(), name, amount, unitPrice}); saveData(); renderStkList(); }
    }
    function renderStkList() {
      let d = document.getElementById('stList');
      if(d) d.innerHTML = stocks.map(x=>`<div class="item-row"><span><b>${x.name}</b><br><small>Birim: ${x.unitPrice}₺</small></span><div style="display:flex; align-items:center; gap:8px;"><button style="background:#334155; color:white; border:none; width:25px; height:25px; border-radius:5px;" onclick="window.stkCh(${x.id},-1)">-</button><b style="color:#f59e0b;">${x.amount}</b><button style="background:#334155; color:white; border:none; width:25px; height:25px; border-radius:5px;" onclick="window.stkCh(${x.id},1)">+</button></div></div>`).join('');
    }
    window.stkCh = function(id, d) { let s=stocks.find(x=>x.id===id); if(s){ s.amount=Math.max(0,s.amount+d); saveData(); renderStkList(); } }

    window.addStaff = function() {
      let name = document.getElementById('pName').value.trim();
      let role = document.getElementById('pRole').value.trim() || 'Personel';
      let salary = parseFloat(document.getElementById('pSal').value) || 0;
      if(name) { staff.push({id:Date.now(), name, role, salary, paid:false}); saveData(); renderStaffList(); }
    }
    function renderStaffList() {
      let d = document.getElementById('pList');
      if(d) d.innerHTML = staff.map(x=>`<div class="item-row"><span><b>${x.name}</b> (${x.role})<br><small style="color:#f59e0b;">Maaş: ${x.salary} TL</small></span><button style="background:#7f1d1d; color:#fca5a5; border:none; padding:5px 10px; border-radius:6px;" onclick="window.delStf(${x.id})">Sil</button></div>`).join('');
    }
    window.delStf = function(id) { staff=staff.filter(x=>x.id!==id); saveData(); renderStaffList(); }

    function renderSalList() {
      let d = document.getElementById('salList');
      if(d) d.innerHTML = staff.map(x=>`<div class="item-row"><span><b>${x.name}</b><br><small style="color:#f59e0b;">${x.salary} TL</small></span><button style="background:${x.paid?'#065f46':'#7f1d1d'}; color:${x.paid?'#6ee7b7':'#fca5a5'}; border:none; padding:6px 12px; border-radius:6px; font-weight:bold;" onclick="window.toggleSal(${x.id})">${x.paid?'Ödendi ✓':'Bekliyor'}</button></div>`).join('');
    }
    window.toggleSal = function(id) { let s=staff.find(x=>x.id===id); if(s){ s.paid=!s.paid; saveData(); renderSalList(); } }

    window.addMgr = function() {
      let name = document.getElementById('mName').value.trim();
      let email = document.getElementById('mMail').value.trim();
      if(name && email) { managers.push({id:Date.now(), name, email, active:true}); saveData(); renderMgrList(); }
    }
    function renderMgrList() {
      let d = document.getElementById('mList');
      if(d) d.innerHTML = managers.map(x=>`<div class="item-row"><span><b>${x.name}</b><br><small>${x.email}</small></span><div style="display:flex; gap:5px;"><button style="background:${x.active?'#78350f':'#065f46'}; color:white; border:none; padding:5px 8px; border-radius:6px; font-size:11px;" onclick="window.toggleMgr(${x.id})">${x.active?'Pasif Yap':'Aktif Yap'}</button><button style="background:#7f1d1d; color:#fca5a5; border:none; padding:5px 8px; border-radius:6px; font-size:11px;" onclick="window.delMgr(${x.id})">Sil</button></div></div>`).join('');
    }
    window.toggleMgr = function(id) { let m=managers.find(x=>x.id===id); if(m){ m.active=!m.active; saveData(); renderMgrList(); } }
    window.delMgr = function(id) { managers=managers.filter(x=>x.id!==id); saveData(); renderMgrList(); }
  </script>
</body>
</html>
