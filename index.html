<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KSB POS</title>

  <meta name="apple-mobile-web-app-title" content="KSB POS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%230d102b'/><circle cx='256' cy='256' r='200' fill='%23f59e0b'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='180' font-weight='900' fill='%230d102b'>KSB</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%230d102b'/><circle cx='256' cy='256' r='200' fill='%23f59e0b'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='180' font-weight='900' fill='%230d102b'>KSB</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d102b;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .pos-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease-in-out;
    }
    .pos-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .pos-card:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 select-none">

  <!-- Üst Bilgi Çubuğu -->
  <header class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-white/10 mb-4 sm:mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center font-black text-slate-950 text-sm tracking-tighter shadow-lg shadow-amber-500/20 border border-amber-200">
        KSB
      </div>
      <div>
        <div class="font-extrabold text-white text-sm tracking-wider flex items-center gap-1.5">
          KSB POS <span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.2 rounded border border-amber-500/30">v4.5</span>
        </div>
        <div class="flex items-center gap-2 text-[10px] text-slate-400">
          <span class="flex items-center gap-1 text-emerald-400 font-semibold">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Server ONLINE
          </span>
          <span class="flex items-center gap-1 text-emerald-400 font-semibold">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Internet ONLINE
          </span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3 text-right">
      <div class="text-xs">
        <div class="font-bold text-white tracking-wide">ALİ OSMAN BEY</div>
        <div class="text-[10px] text-slate-400">YÖNETİCİ / ÖDEME NOKTASI</div>
      </div>
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-lg">
        AO
      </div>
    </div>
  </header>

  <!-- ANA DASHBOARD -->
  <main id="mainDashboard" class="flex-1 max-w-4xl mx-auto w-full flex flex-col justify-center my-auto">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5">
      
      <button onclick="openModule('faturalar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center shadow-lg shadow-pink-500/30 group-hover:scale-105 transition text-2xl">📜</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Faturalar</span>
      </button>

      <button onclick="openModule('cariler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition text-2xl">🏢</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Cariler</span>
      </button>

      <button onclick="openModule('stoklar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition text-2xl">📦</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Stok Sayımı</span>
      </button>

      <button onclick="openModule('personel')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-105 transition text-2xl">👥</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Personel Listesi</span>
      </button>

      <button onclick="openModule('maaslar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/30 group-hover:scale-105 transition text-2xl">💰</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Maaş Takibi</span>
      </button>

      <button onclick="openModule('raporlar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-fuchsia-500 to-pink-600 flex items-center justify-center shadow-lg shadow-fuchsia-500/30 group-hover:scale-105 transition text-2xl">📊</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Raporlar (Giderler)</span>
      </button>

      <button onclick="openModule('yoneticiler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group col-span-2 sm:col-span-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow text-lg text-white">🛡️</div>
        <span class="font-bold text-xs text-indigo-200">Yönetici & Yetki Yönetim Paneli</span>
      </button>

    </div>
  </main>

  <!-- MODÜL EKRANI -->
  <section id="moduleContent" class="hidden flex-1 max-w-4xl mx-auto w-full bg-slate-900/90 rounded-3xl p-4 sm:p-6 border border-white/10 shadow-2xl flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
      <button onclick="closeModule()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2 border border-white/10">
        ⬅️ Ana Menü
      </button>
      <h2 id="moduleTitle" class="text-sm sm:text-base font-bold text-white">Modül Başlığı</h2>
    </div>
    <div id="moduleBody" class="flex-1 overflow-y-auto space-y-4 text-xs"></div>
  </section>

  <footer class="flex justify-between items-center text-[11px] text-slate-500 pt-3 border-t border-white/5">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-amber-400"></span>
      <span class="font-bold text-slate-400">KSB POS SYSTEM</span>
    </div>
    <div id="clockDisplay" class="font-bold text-slate-400">--:--</div>
  </footer>

  <script>
    let invoices = JSON.parse(localStorage.getItem('invoices_data')) || [];
    let suppliers = JSON.parse(localStorage.getItem('suppliers_data')) || ['Kahve Sarayı Tedarik', 'Uludağ İçecek', 'Leonaza Gıda'];
    let staffList = JSON.parse(localStorage.getItem('staff_data')) || [
      { id: 1, name: 'Barista Ahmet', role: 'Barista', phone: '0530 000 0000', salary: 25000, paid: false }
    ];
    let stockList = JSON.parse(localStorage.getItem('stock_data')) || [
      { id: 1, name: 'Espresso Çekirdeği (Kg)', amount: 15, unitPrice: 450 }
    ];
    let managers = JSON.parse(localStorage.getItem('managers_data')) || [
      { id: 1, name: 'Ali Osman Bey', email: 'ali@dukkan.com', role: 'Süper Admin', isAdmin: true, isActive: true },
      { id: 2, name: 'İskender Selçuk', email: 'aliosman.erol@icloud.com', role: 'Yönetici', isAdmin: true, isActive: true }
    ];

    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      localStorage.setItem('invoices_data', JSON.stringify(invoices));
      localStorage.setItem('suppliers_data', JSON.stringify(suppliers));
      localStorage.setItem('staff_data', JSON.stringify(staffList));
      localStorage.setItem('stock_data', JSON.stringify(stockList));
      localStorage.setItem('managers_data', JSON.stringify(managers));
    }

    function openModule(moduleName) {
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('moduleContent').classList.remove('hidden');
      const title = document.getElementById('moduleTitle');
      const body = document.getElementById('moduleBody');

      if (moduleName === 'faturalar') {
        title.innerText = '📜 Fatura Takip';
        renderInvoicesView(body);
      } else if (moduleName === 'cariler') {
        title.innerText = '🏢 Cariler (Tedarikçiler)';
        renderSuppliersView(body);
      } else if (moduleName === 'stoklar') {
        title.innerText = '📦 Stok Sayımı';
        renderStockView(body);
      } else if (moduleName === 'personel') {
        title.innerText = '👥 Personel Listesi';
        renderStaffView(body);
      } else if (moduleName === 'maaslar') {
        title.innerText = '💰 Maaş Takibi';
        renderSalariesView(body);
      } else if (moduleName === 'raporlar') {
        title.innerText = '📊 Raporlar & Ay Sonu Giderler';
        renderReportsView(body);
      } else if (moduleName === 'yoneticiler') {
        title.innerText = '🛡️ Yönetici & Yetki Paneli';
        renderManagersView(body);
      }
    }

    function closeModule() {
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('moduleContent').classList.add('hidden');
    }

    // --- 1. YÖNETİCİ VE YETKİ PANELİ ---
    function renderManagersView(container) {
      container.innerHTML = `
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-white/10 space-y-2.5">
          <span class="font-bold text-white block">Yeni Yönetici Ekle:</span>
          <div class="flex gap-2">
            <input type="text" id="mName" placeholder="Ad Soyad" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
            <input type="email" id="mEmail" placeholder="E-posta" class="w-1/2 bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
          </div>
          <button onclick="addManager()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 rounded-xl text-white">Yönetici Ekle</button>
        </div>

        <div class="space-y-2 pt-2">
          <span class="font-bold text-slate-400 block">Kullanıcı Listesi & Yetki Yönetimi:</span>
          <div id="managerListContainer" class="space-y-2"></div>
        </div>
      `;

      const list = document.getElementById('managerListContainer');
      list.innerHTML = '';
      managers.forEach(m => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
              <div class="font-bold text-white flex items-center gap-2">
                ${m.name}
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${m.isAdmin ? 'bg-indigo-950 text-indigo-300 border border-indigo-500/30' : 'bg-slate-700 text-slate-300'}">${m.role}</span>
                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${m.isActive ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/30' : 'bg-red-950 text-red-400 border border-red-500/30'}">${m.isActive ? 'Aktif' : 'Pasif'}</span>
              </div>
              <div class="text-[10px] text-slate-400">${m.email}</div>
            </div>
            <div class="flex gap-1.5 w-full sm:w-auto">
              <button onclick="toggleManagerActive(${m.id})" class="flex-1 sm:flex-none px-2.5 py-1.5 rounded-lg font-bold border text-[11px] ${m.isActive ? 'bg-amber-950/50 text-amber-300 border-amber-500/30' : 'bg-emerald-950/50 text-emerald-300 border-emerald-500/30'}">
                ${m.isActive ? 'Pasif Yap' : 'Aktif Yap'}
              </button>
              <button onclick="toggleManagerAdmin(${m.id})" class="flex-1 sm:flex-none px-2.5 py-1.5 rounded-lg font-bold border text-[11px] ${m.isAdmin ? 'bg-indigo-950/50 text-indigo-300 border border-indigo-500/30' : 'bg-purple-950/50 text-purple-300 border-purple-500/30'}">
                ${m.isAdmin ? 'Yöneticiliği Kaldır' : 'Yönetici Yap'}
              </button>
              <button onclick="deleteManager(${m.id})" class="px-2.5 py-1.5 bg-red-950/50 text-red-400 border border-red-500/30 rounded-lg font-bold text-[11px]">Sil</button>
            </div>
          </div>
        `;
      });
    }

    function addManager() {
      const name = document.getElementById('mName').value.trim();
      const email = document.getElementById('mEmail').value.trim();
      if (name && email) {
        managers.push({ id: Date.now(), name, email, role: 'Yönetici', isAdmin: true, isActive: true });
        saveData();
        renderManagersView(document.getElementById('moduleBody'));
      }
    }

    function toggleManagerActive(id) {
      const m = managers.find(item => item.id === id);
      if (m) { m.isActive = !m.isActive; saveData(); renderManagersView(document.getElementById('moduleBody')); }
    }

    function toggleManagerAdmin(id) {
      const m = managers.find(item => item.id === id);
      if (m) { m.isAdmin = !m.isAdmin; m.role = m.isAdmin ? 'Yönetici' : 'Personel'; saveData(); renderManagersView(document.getElementById('moduleBody')); }
    }

    function deleteManager(id) {
      managers = managers.filter(item => item.id !== id);
      saveData();
      renderManagersView(document.getElementById('moduleBody'));
    }

    // --- 2. CARİLER ---
    function renderSuppliersView(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl flex gap-2">
          <input type="text" id="supInput" placeholder="Tedarikçi Firma Adı" class="flex-1 bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
          <button onclick="addSupplier()" class="bg-blue-600 px-4 font-bold rounded-lg text-white">Ekle</button>
        </div>
        <div class="space-y-2 pt-2" id="supplierList"></div>
      `;
      const list = document.getElementById('supplierList');
      suppliers.forEach((s, idx) => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <span class="font-bold text-white">${s}</span>
            <button onclick="deleteSupplier(${idx})" class="text-red-400 font-bold px-2 py-1 bg-red-950/40 border border-red-500/20 rounded">Sil</button>
          </div>
        `;
      });
    }
    function addSupplier() {
      const v = document.getElementById('supInput').value.trim();
      if(v) { suppliers.push(v); saveData(); renderSuppliersView(document.getElementById('moduleBody')); }
    }
    function deleteSupplier(idx) { suppliers.splice(idx,1); saveData(); renderSuppliersView(document.getElementById('moduleBody')); }

    // --- 3. STOK SAYIMI ---
    function renderStockView(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl space-y-2">
          <input type="text" id="stName" placeholder="Ürün Adı" class="w-full bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
          <div class="flex gap-2">
            <input type="number" id="stAmt" placeholder="Miktar" class="w-1/2 bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
            <input type="number" id="stPrice" placeholder="Birim Fiyat (TL)" class="w-1/2 bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
          </div>
          <button onclick="addStock()" class="w-full bg-purple-600 font-bold py-2 rounded-lg text-white">Stok Kalemi Ekle</button>
        </div>
        <div class="space-y-2 pt-2" id="stockList"></div>
      `;
      const list = document.getElementById('stockList');
      stockList.forEach((s) => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${s.name}</div>
              <div class="text-[10px] text-slate-400">Birim: ${s.unitPrice} TL</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateStock(${s.id}, -1)" class="w-7 h-7 bg-slate-700 font-bold text-white rounded">-</button>
              <span class="font-bold text-amber-400 px-2">${s.amount}</span>
              <button onclick="updateStock(${s.id}, 1)" class="w-7 h-7 bg-slate-700 font-bold text-white rounded">+</button>
            </div>
          </div>
        `;
      });
    }
    function addStock() {
      const name = document.getElementById('stName').value.trim();
      const amount = parseFloat(document.getElementById('stAmt').value) || 0;
      const unitPrice = parseFloat(document.getElementById('stPrice').value) || 0;
      if(name) { stockList.push({ id: Date.now(), name, amount, unitPrice }); saveData(); renderStockView(document.getElementById('moduleBody')); }
    }
    function updateStock(id, diff) {
      const item = stockList.find(s => s.id === id);
      if(item) { item.amount = Math.max(0, item.amount + diff); saveData(); renderStockView(document.getElementById('moduleBody')); }
    }

    // --- 4. PERSONEL LİSTESİ ---
    function renderStaffView(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl space-y-2">
          <input type="text" id="stfName" placeholder="Personel Adı" class="w-full bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
          <div class="flex gap-2">
            <input type="text" id="stfRole" placeholder="Görevi (Barista vs.)" class="w-1/2 bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
            <input type="number" id="stfSalary" placeholder="Maaş (TL)" class="w-1/2 bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
          </div>
          <button onclick="addStaff()" class="w-full bg-amber-600 font-bold py-2 rounded-lg text-white">Personel Kaydet</button>
        </div>
        <div class="space-y-2 pt-2" id="staffList"></div>
      `;
      const list = document.getElementById('staffList');
      staffList.forEach((st) => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${st.name} (${st.role})</div>
              <div class="text-[10px] text-slate-400">Maaş: ${st.salary} TL</div>
            </div>
            <button onclick="deleteStaff(${st.id})" class="text-red-400 font-bold px-2 py-1 bg-red-950/40 border border-red-500/20 rounded">Sil</button>
          </div>
        `;
      });
    }
    function addStaff() {
      const name = document.getElementById('stfName').value.trim();
      const role = document.getElementById('stfRole').value.trim() || 'Personel';
      const salary = parseFloat(document.getElementById('stfSalary').value) || 0;
      if(name) { staffList.push({ id: Date.now(), name, role, salary, paid: false }); saveData(); renderStaffView(document.getElementById('moduleBody')); }
    }
    function deleteStaff(id) { staffList = staffList.filter(s => s.id !== id); saveData(); renderStaffView(document.getElementById('moduleBody')); }

    // --- 5. MAAŞ TAKİBİ ---
    function renderSalariesView(c) {
      c.innerHTML = `
        <div class="space-y-2" id="salaryList"></div>
      `;
      const list = document.getElementById('salaryList');
      staffList.forEach((st) => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${st.name}</div>
              <div class="text-[10px] text-amber-300 font-bold">Maaş: ${st.salary} TL</div>
            </div>
            <button onclick="toggleSalaryPaid(${st.id})" class="px-3 py-1.5 rounded-lg font-bold border ${st.paid ? 'bg-emerald-950 text-emerald-400 border-emerald-500/30' : 'bg-red-950 text-red-400 border border-red-500/30'}">
              ${st.paid ? 'Ödendi ✓' : 'Ödeme Bekliyor'}
            </button>
          </div>
        `;
      });
    }
    function toggleSalaryPaid(id) {
      const st = staffList.find(s => s.id === id);
      if(st) { st.paid = !st.paid; saveData(); renderSalariesView(document.getElementById('moduleBody')); }
    }

    // --- 6. FATURALAR & RAPORLAR ---
    function renderInvoicesView(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl space-y-2">
          <input type="text" id="invSup" placeholder="Tedarikçi Adı" class="w-full bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
          <input type="number" id="invTotal" placeholder="Fatura Tutarı (TL)" class="w-full bg-slate-900 p-2 rounded-lg text-white border border-slate-700">
          <button onclick="addInvoice()" class="w-full bg-pink-600 font-bold py-2 rounded-lg text-white">Fatura Kaydet</button>
        </div>
        <div class="space-y-2 pt-2" id="invList"></div>
      `;
      const list = document.getElementById('invList');
      invoices.forEach((inv, idx) => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${inv.supplier}</div>
              <div class="text-[10px] text-slate-400">Tutar: ${inv.total} TL</div>
            </div>
            <button onclick="deleteInvoice(${idx})" class="text-red-400 font-bold px-2 py-1 bg-red-950/40 border border-red-500/20 rounded">Sil</button>
          </div>
        `;
      });
    }
    function addInvoice() {
      const supplier = document.getElementById('invSup').value.trim();
      const total = parseFloat(document.getElementById('invTotal').value) || 0;
      if(supplier && total) { invoices.push({ supplier, total, date: new Date().toLocaleDateString() }); saveData(); renderInvoicesView(document.getElementById('moduleBody')); }
    }
    function deleteInvoice(idx) { invoices.splice(idx,1); saveData(); renderInvoicesView(document.getElementById('moduleBody')); }

    function renderReportsView(c) {
      const totalSalaries = staffList.reduce((acc, st) => acc + st.salary, 0);
      const totalInvoices = invoices.reduce((acc, inv) => acc + inv.total, 0);
      const grandTotal = totalSalaries + totalInvoices;

      c.innerHTML = `
        <div class="grid grid-cols-1 gap-3">
          <div class="bg-slate-800 p-4 rounded-2xl border border-white/10 flex justify-between items-center">
            <span class="text-slate-300 font-semibold">Toplam Fatura Giderleri:</span>
            <span class="text-pink-400 font-extrabold text-base">${totalInvoices} TL</span>
          </div>
          <div class="bg-slate-800 p-4 rounded-2xl border border-white/10 flex justify-between items-center">
            <span class="text-slate-300 font-semibold">Toplam Maaş Giderleri:</span>
            <span class="text-amber-400 font-extrabold text-base">${totalSalaries} TL</span>
          </div>
          <div class="bg-gradient-to-r from-purple-900/60 to-indigo-900/60 p-4 rounded-2xl border border-indigo-500/30 flex justify-between items-center">
            <span class="text-white font-bold">GENEL TOPLAM GİDER:</span>
            <span class="text-emerald-400 font-black text-lg">${grandTotal} TL</span>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
