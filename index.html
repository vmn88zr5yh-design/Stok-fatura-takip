<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KSB POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d102b; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .pos-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: all 0.2s ease-in-out; }
    .pos-card:active { transform: scale(0.98); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 select-none">

  <header class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-white/10 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500 flex items-center justify-center font-black text-slate-950 text-sm shadow-lg">KSB</div>
      <div>
        <div class="font-extrabold text-white text-sm">KSB POS <span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded">v10.0</span></div>
        <div class="text-[10px] text-emerald-400 font-semibold">● Sistem Aktif</div>
      </div>
    </div>
    <div class="text-right text-xs">
      <div class="font-bold text-white">ALİ OSMAN BEY</div>
      <div class="text-[10px] text-slate-400">YÖNETİCİ</div>
    </div>
  </header>

  <main id="mainDashboard" class="flex-1 max-w-4xl mx-auto w-full flex flex-col justify-center my-auto">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5">
      <button onclick="openModule('faturalar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2">
        <div class="w-14 h-14 rounded-2xl bg-pink-600 flex items-center justify-center text-2xl shadow-lg">📸</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Fatura & Fotoğraf</span>
      </button>
      <button onclick="openModule('cariler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2">
        <div class="w-14 h-14 rounded-2xl bg-blue-600 flex items-center justify-center text-2xl shadow-lg">🏢</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Cari Borç Takibi</span>
      </button>
      <button onclick="openModule('stoklar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2">
        <div class="w-14 h-14 rounded-2xl bg-purple-600 flex items-center justify-center text-2xl shadow-lg">📦</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Stok Yönetimi</span>
      </button>
      <button onclick="openModule('personel')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2">
        <div class="w-14 h-14 rounded-2xl bg-amber-600 flex items-center justify-center text-2xl shadow-lg">👥</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Personel Listesi</span>
      </button>
      <button onclick="openModule('maaslar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2">
        <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-2xl shadow-lg">💰</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Maaş Takibi</span>
      </button>
      <button onclick="openModule('raporlar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2">
        <div class="w-14 h-14 rounded-2xl bg-fuchsia-600 flex items-center justify-center text-2xl shadow-lg">📊</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Ay Sonu Raporu</span>
      </button>
      <button onclick="openModule('yoneticiler')" class="pos-card rounded-3xl p-4 flex flex-col items-center justify-center gap-1 col-span-2 sm:col-span-3">
        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-sm">🛡️</div>
        <span class="font-bold text-xs text-indigo-200">Yönetici Yetki & Aktif/Pasif Paneli</span>
      </button>
    </div>
  </main>

  <section id="moduleContent" class="hidden flex-1 max-w-4xl mx-auto w-full bg-slate-900/90 rounded-3xl p-4 sm:p-6 border border-white/10 shadow-2xl flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
      <button onclick="closeModule()" class="bg-slate-800 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl border border-white/10">⬅️ Ana Menü</button>
      <h2 id="moduleTitle" class="text-sm sm:text-base font-bold text-white">Modül</h2>
    </div>
    <div id="moduleBody" class="flex-1 overflow-y-auto space-y-3 text-xs"></div>
  </section>

  <footer class="flex justify-between items-center text-[11px] text-slate-500 pt-3 border-t border-white/5">
    <span class="font-bold text-slate-400">KSB POS SYSTEM</span>
    <span id="clockDisplay" class="font-bold text-slate-400">--:--</span>
  </footer>

  <script>
    let invoices = JSON.parse(localStorage.getItem('invoices_v10')) || [];
    let suppliers = JSON.parse(localStorage.getItem('suppliers_v10')) || [{ name: 'Kahve Sarayı Tedarik', balance: 12500 }];
    let staffList = JSON.parse(localStorage.getItem('staff_v10')) || [{ id: 1, name: 'Barista Ahmet', role: 'Barista', salary: 25000, paid: false }];
    let stockList = JSON.parse(localStorage.getItem('stock_v10')) || [{ id: 1, name: 'Espresso (Kg)', amount: 15, unitPrice: 450 }];
    let managers = JSON.parse(localStorage.getItem('managers_v10')) || [
      { id: 1, name: 'Ali Osman Bey', email: 'ali@dukkan.com', role: 'Süper Admin', isAdmin: true, isActive: true },
      { id: 2, name: 'İskender Selçuk', email: 'aliosman.erol@icloud.com', role: 'Yönetici', isAdmin: true, isActive: true }
    ];

    setInterval(() => {
      document.getElementById('clockDisplay').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      localStorage.setItem('invoices_v10', JSON.stringify(invoices));
      localStorage.setItem('suppliers_v10', JSON.stringify(suppliers));
      localStorage.setItem('staff_v10', JSON.stringify(staffList));
      localStorage.setItem('stock_v10', JSON.stringify(stockList));
      localStorage.setItem('managers_v10', JSON.stringify(managers));
    }

    function openModule(name) {
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('moduleContent').classList.remove('hidden');
      const title = document.getElementById('moduleTitle');
      const body = document.getElementById('moduleBody');

      if (name === 'faturalar') { title.innerText = '📸 Fatura Fotoğrafı Yükle'; renderInvoices(body); }
      else if (name === 'cariler') { title.innerText = '🏢 Cari Borç Takibi'; renderSuppliers(body); }
      else if (name === 'stoklar') { title.innerText = '📦 Stok Yönetimi'; renderStock(body); }
      else if (name === 'personel') { title.innerText = '👥 Personel Listesi'; renderStaff(body); }
      else if (name === 'maaslar') { title.innerText = '💰 Maaş Takibi'; renderSalaries(body); }
      else if (name === 'raporlar') { title.innerText = '📊 Ay Sonu Gider Raporu'; renderReports(body); }
      else if (name === 'yoneticiler') { title.innerText = '🛡️ Yönetici Yetki Paneli'; renderManagers(body); }
    }

    function closeModule() {
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('moduleContent').classList.add('hidden');
    }

    function renderInvoices(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl space-y-2">
          <input type="file" id="invFile" accept="image/*" capture="environment" class="w-full bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          <input type="text" id="invSup" placeholder="Firma Adı" class="w-full bg-slate-900 p-2.5 rounded-xl text-white border border-slate-700">
          <div class="grid grid-cols-3 gap-2">
            <input type="number" id="invSub" placeholder="Ara Toplam" class="bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
            <input type="number" id="invKdv" placeholder="KDV" class="bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
            <input type="number" id="invDisc" placeholder="İskonto" class="bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          </div>
          <button onclick="saveInvoice()" class="w-full bg-pink-600 font-bold py-2.5 rounded-xl text-white">Faturayı Kaydet</button>
        </div>
        <div id="invList" class="space-y-2 pt-2"></div>`;
      updateInvoiceList();
    }

    function saveInvoice() {
      const sup = document.getElementById('invSup').value.trim();
      const sub = parseFloat(document.getElementById('invSub').value) || 0;
      const kdv = parseFloat(document.getElementById('invKdv').value) || 0;
      const disc = parseFloat(document.getElementById('invDisc').value) || 0;
      const total = sub + kdv - disc;
      if(sup && total > 0) {
        invoices.push({ sup, total, date: new Date().toLocaleDateString() });
        let s = suppliers.find(x => x.name.toLowerCase() === sup.toLowerCase());
        if(s) s.balance += total; else suppliers.push({ name: sup, balance: total });
        saveData();
        updateInvoiceList();
        alert('Fatura kaydedildi!');
      } else { alert('Eksik bilgi girdiniz.'); }
    }

    function updateInvoiceList() {
      const list = document.getElementById('invList');
      if(!list) return;
      list.innerHTML = invoices.map((inv, i) => `
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
          <div><div class="font-bold text-white">${inv.sup}</div><div class="text-[10px] text-pink-400">Toplam: ${inv.total} TL</div></div>
          <button onclick="invoices.splice(${i},1);saveData();updateInvoiceList();" class="bg-red-950 text-red-400 px-2 py-1 rounded">Sil</button>
        </div>`).join('');
    }

    function renderSuppliers(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl flex gap-2">
          <input type="text" id="supInput" placeholder="Tedarikçi Adı" class="flex-1 bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          <input type="number" id="supB" placeholder="Borç" class="w-24 bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          <button onclick="addSup()" class="bg-blue-600 px-3 font-bold rounded-xl text-white">Ekle</button>
        </div>
        <div id="supList" class="space-y-2 pt-2"></div>`;
      updateSupList();
    }
    function addSup() {
      let n = document.getElementById('supInput').value.trim();
      let b = parseFloat(document.getElementById('supB').value) || 0;
      if(n) { suppliers.push({name: n, balance: b}); saveData(); updateSupList(); }
    }
    function updateSupList() {
      const list = document.getElementById('supList');
      if(!list) return;
      list.innerHTML = suppliers.map((s, i) => `
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
          <div><div class="font-bold text-white">${s.name}</div><div class="text-xs text-rose-400">Borç: ${s.balance} TL</div></div>
          <div class="flex gap-1">
            <button onclick="let m=prompt('Ödenen:'); if(m){s.balance=Math.max(0,s.balance-m);saveData();updateSupList();}" class="bg-emerald-950 text-emerald-300 px-2 py-1 rounded">Öde</button>
            <button onclick="suppliers.splice(${i},1);saveData();updateSupList();" class="bg-red-950 text-red-400 px-2 py-1 rounded">Sil</button>
          </div>
        </div>`).join('');
    }

    function renderStock(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl space-y-2">
          <input type="text" id="stName" placeholder="Ürün Adı" class="w-full bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          <div class="flex gap-2">
            <input type="number" id="stAmt" placeholder="Miktar" class="w-1/2 bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
            <input type="number" id="stPrice" placeholder="Birim Fiyat" class="w-1/2 bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          </div>
          <button onclick="addStk()" class="w-full bg-purple-600 font-bold py-2 rounded-xl text-white">Ekle</button>
        </div>
        <div id="stkList" class="space-y-2 pt-2"></div>`;
      updateStkList();
    }
    function addStk() {
      let name = document.getElementById('stName').value.trim();
      let amount = parseFloat(document.getElementById('stAmt').value) || 0;
      let unitPrice = parseFloat(document.getElementById('stPrice').value) || 0;
      if(name) { stockList.push({id: Date.now(), name, amount, unitPrice}); saveData(); updateStkList(); }
    }
    function updateStkList() {
      const list = document.getElementById('stkList');
      if(!list) return;
      list.innerHTML = stockList.map(s => `
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
          <div><div class="font-bold text-white">${s.name}</div><div class="text-[10px] text-slate-400">Birim: ${s.unitPrice}₺</div></div>
          <div class="flex items-center gap-2">
            <button onclick="s.amount=Math.max(0,s.amount-1);saveData();updateStkList();" class="w-6 h-6 bg-slate-700 font-bold rounded">-</button>
            <span class="font-bold text-amber-400">${s.amount}</span>
            <button onclick="s.amount+=1;saveData();updateStkList();" class="w-6 h-6 bg-slate-700 font-bold rounded">+</button>
          </div>
        </div>`).join('');
    }

    function renderStaff(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl space-y-2">
          <input type="text" id="stfN" placeholder="Personel Adı" class="w-full bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          <div class="flex gap-2">
            <input type="text" id="stfR" placeholder="Rol" class="w-1/2 bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
            <input type="number" id="stfS" placeholder="Maaş" class="w-1/2 bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          </div>
          <button onclick="addStf()" class="w-full bg-amber-600 font-bold py-2 rounded-xl text-white">Personel Ekle</button>
        </div>
        <div id="stfList" class="space-y-2 pt-2"></div>`;
      updateStfList();
    }
    function addStf() {
      let name = document.getElementById('stfN').value.trim();
      let role = document.getElementById('stfR').value.trim() || 'Personel';
      let salary = parseFloat(document.getElementById('stfS').value) || 0;
      if(name) { staffList.push({id: Date.now(), name, role, salary, paid: false}); saveData(); updateStfList(); }
    }
    function updateStfList() {
      const list = document.getElementById('stfList');
      if(!list) return;
      list.innerHTML = staffList.map(st => `
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
          <div><div class="font-bold text-white">${st.name} (${st.role})</div><div class="text-[10px] text-amber-300">Maaş: ${st.salary} TL</div></div>
          <button onclick="staffList=staffList.filter(x=>x.id!==${st.id});saveData();updateStfList();" class="bg-red-950 text-red-400 px-2 py-1 rounded">Sil</button>
        </div>`).join('');
    }

    function renderSalaries(c) {
      c.innerHTML = staffList.map(st => `
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
          <div><div class="font-bold text-white">${st.name}</div><div class="text-[10px] text-amber-300">Maaş: ${st.salary} TL</div></div>
          <button onclick="st.paid=!st.paid;saveData();renderSalaries(document.getElementById('moduleBody'));" class="px-3 py-1 rounded font-bold ${st.paid ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}">
            ${st.paid ? 'Ödendi ✓' : 'Bekliyor'}
          </button>
        </div>`).join('');
    }

    function renderReports(c) {
      let totInv = invoices.reduce((a,b) => a + b.total, 0);
      let totSal = staffList.reduce((a,b) => a + b.salary, 0);
      let totDebt = suppliers.reduce((a,b) => a + b.balance, 0);
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between"><span>Toplam Fatura:</span><span class="text-pink-400 font-bold">${totInv} TL</span></div>
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between"><span>Toplam Maaş:</span><span class="text-amber-400 font-bold">${totSal} TL</span></div>
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between"><span>Açık Cari Borç:</span><span class="text-rose-400 font-bold">${totDebt} TL</span></div>
        <div class="bg-indigo-950 p-3 rounded-xl flex justify-between font-bold text-white"><span>GENEL TOPLAM:</span><span class="text-emerald-400">${totInv + totSal} TL</span></div>`;
    }

    function renderManagers(c) {
      c.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-xl space-y-2">
          <input type="text" id="mN" placeholder="Ad Soyad" class="w-full bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          <input type="email" id="mE" placeholder="E-posta" class="w-full bg-slate-900 p-2 rounded-xl text-white border border-slate-700">
          <button onclick="let n=document.getElementById('mN').value, e=document.getElementById('mE').value; if(n&&e){managers.push({id:Date.now(),name:n,email:e,role:'Yönetici',isAdmin:true,isActive:true});saveData();renderManagers(c);}" class="w-full bg-indigo-600 font-bold py-2 rounded-xl text-white">Yönetici Ekle</button>
        </div>
        <div id="manList" class="space-y-2 pt-2"></div>`;
      updateManList();
    }
    function updateManList() {
      const list = document.getElementById('manList');
      if(!list) return;
      list.innerHTML = managers.map(m => `
        <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center">
          <div>
            <div class="font-bold text-white flex items-center gap-1">${m.name} <span class="text-[9px] px-1.5 rounded ${m.isActive?'bg-emerald-950 text-emerald-400':'bg-red-950 text-red-400'}">${m.isActive?'Aktif':'Pasif'}</span></div>
            <div class="text-[10px] text-slate-400">${m.email}</div>
          </div>
          <div class="flex gap-1">
            <button onclick="m.isActive=!m.isActive;saveData();updateManList();" class="px-2 py-1 rounded bg-slate-700 text-white text-[10px]">${m.isActive?'Pasif Yap':'Aktif Yap'}</button>
            <button onclick="managers=managers.filter(x=>x.id!==${m.id});saveData();updateManList();" class="px-2 py-1 rounded bg-red-950 text-red-400 text-[10px]">Sil</button>
          </div>
        </div>`).join('');
    }
  </script>
</body>
</html>
