<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS & Restoran Yönetim Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d102b;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .pos-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease-in-out;
    }
    .pos-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .pos-card:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 select-none">

  <!-- Üst Bilgi Çubuğu -->
  <header class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-white/10 mb-4 sm:mb-6">
    <div class="flex items-center gap-3 text-xs">
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Server</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Internet</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
    </div>

    <div class="flex items-center gap-3 text-right">
      <div class="text-xs">
        <div class="font-bold text-white tracking-wide">ALİ OSMAN BEY</div>
        <div class="text-[10px] text-slate-400">YÖNETİCİ / ÖDEME NOKTASI</div>
      </div>
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-lg">
        AO
      </div>
    </div>
  </header>

  <!-- ANA DASHBOARD (KUTUCUKLAR) -->
  <main id="mainDashboard" class="flex-1 max-w-4xl mx-auto w-full flex flex-col justify-center my-auto">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5">
      
      <!-- 1. Faturalar -->
      <button onclick="openModule('faturalar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center shadow-lg shadow-pink-500/30 group-hover:scale-105 transition text-2xl">📜</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Faturalar</span>
      </button>

      <!-- 2. Cariler -->
      <button onclick="openModule('cariler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition text-2xl">🏢</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Cariler</span>
      </button>

      <!-- 3. Stok Sayımı -->
      <button onclick="openModule('stoklar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition text-2xl">📦</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Stok Sayımı</span>
      </button>

      <!-- 4. Personel Listesi -->
      <button onclick="openModule('personel')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-105 transition text-2xl">👥</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Personel Listesi</span>
      </button>

      <!-- 5. Maaş Takibi -->
      <button onclick="openModule('maaslar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/30 group-hover:scale-105 transition text-2xl">💰</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Maaş Takibi</span>
      </button>

      <!-- 6. Raporlar & Giderler -->
      <button onclick="openModule('raporlar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-fuchsia-500 to-pink-600 flex items-center justify-center shadow-lg shadow-fuchsia-500/30 group-hover:scale-105 transition text-2xl">📊</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Raporlar (Giderler)</span>
      </button>

      <!-- 7. Ayarlar -->
      <button onclick="openModule('ayarlar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group col-span-2 sm:col-span-3">
        <div class="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center shadow text-lg">⚙️</div>
        <span class="font-bold text-xs text-slate-300">Sistem Ayarları (API Key)</span>
      </button>

    </div>
  </main>

  <!-- MODÜL İÇERİK EKRANI -->
  <section id="moduleContent" class="hidden flex-1 max-w-4xl mx-auto w-full bg-slate-900/90 rounded-3xl p-4 sm:p-6 border border-white/10 shadow-2xl flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
      <button onclick="closeModule()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2 border border-white/10">
        ⬅️ Ana Menü
      </button>
      <h2 id="moduleTitle" class="text-sm sm:text-base font-bold text-white">Modül Başlığı</h2>
    </div>
    
    <div id="moduleBody" class="flex-1 overflow-y-auto space-y-4 text-xs">
      <!-- Dinamik İçerik -->
    </div>
  </section>

  <!-- Alt Bilgi Çubuğu -->
  <footer class="flex justify-between items-center text-[11px] text-slate-500 pt-3 border-t border-white/5">
    <div>POS CENTURY v3.0</div>
    <div id="clockDisplay" class="font-bold text-slate-400">--:--</div>
  </footer>

  <script>
    // Veri Deposu (LocalStorage)
    let invoices = JSON.parse(localStorage.getItem('invoices_data')) || [];
    let suppliers = JSON.parse(localStorage.getItem('suppliers_data')) || ['Kahve', 'Uludağ', 'Leonaza Gıda', 'Diğer'];
    let staffList = JSON.parse(localStorage.getItem('staff_data')) || [
      { id: 1, name: 'Barista Ahmet', role: 'Barista', phone: '0530 000 0000', salary: 25000, paid: false },
      { id: 2, name: 'Mehmet Yılmaz', role: 'Kasiyer', phone: '0532 111 2233', salary: 22000, paid: true }
    ];
    let stockList = JSON.parse(localStorage.getItem('stock_data')) || [
      { id: 1, name: 'Espresso Çekirdeği (Kg)', amount: 15, unitPrice: 450 },
      { id: 2, name: 'Tam Yağlı Süt (Litre)', amount: 24, unitPrice: 32 }
    ];

    // Saat Güncelleme
    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      localStorage.setItem('invoices_data', JSON.stringify(invoices));
      localStorage.setItem('suppliers_data', JSON.stringify(suppliers));
      localStorage.setItem('staff_data', JSON.stringify(staffList));
      localStorage.setItem('stock_data', JSON.stringify(stockList));
    }

    // MODÜL AÇILDIĞINDA ÇALIŞACAK MANTIKLAR
    function openModule(moduleName) {
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('moduleContent').classList.remove('hidden');
      const title = document.getElementById('moduleTitle');
      const body = document.getElementById('moduleBody');

      if (moduleName === 'faturalar') {
        title.innerText = '📜 Fatura Tarama & Takip';
        renderInvoicesView(body);
      } else if (moduleName === 'cariler') {
        title.innerText = '🏢 Cari (Tedarikçi) Listesi & Yönetim';
        renderSuppliersView(body);
      } else if (moduleName === 'stoklar') {
        title.innerText = '📦 Stok Sayımı & Otomatik Yükleme';
        renderStockView(body);
      } else if (moduleName === 'personel') {
        title.innerText = '👥 Personel Listesi & Düzenleme';
        renderStaffView(body);
      } else if (moduleName === 'maaslar') {
        title.innerText = '💰 Personel Maaş Takibi';
        renderSalariesView(body);
      } else if (moduleName === 'raporlar') {
        title.innerText = '📊 Ay Sonu Gider & Rapor Paneli';
        renderReportsView(body);
      } else if (moduleName === 'ayarlar') {
        title.innerText = '⚙️ Gemini API Ayarları';
        renderSettingsView(body);
      }
    }

    function closeModule() {
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('moduleContent').classList.add('hidden');
    }

    // --- 1. CARİLER SEKMESİ ---
    function renderSuppliersView(container) {
      container.innerHTML = `
        <div class="bg-slate-800/80 p-3 rounded-2xl border border-white/10 space-y-2">
          <label class="font-bold text-white block">Yeni Cari/Tedarikçi Ekle:</label>
          <div class="flex gap-2">
            <input type="text" id="newSupplierInput" placeholder="Firma Adı (Örn: Sütaş Gıda)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
            <button onclick="addSupplier()" class="bg-blue-600 font-bold px-4 rounded-xl text-white">Ekle</button>
          </div>
        </div>
        <div class="space-y-2">
          <span class="font-bold text-slate-400 block">Kayıtlı Tedarikçiler:</span>
          <div id="supplierListContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
        </div>
      `;
      const list = document.getElementById('supplierListContainer');
      suppliers.forEach((s, idx) => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <span class="font-bold text-white">${s}</span>
            <button onclick="removeSupplier(${idx})" class="text-red-400 font-bold hover:underline">Sil</button>
          </div>
        `;
      });
    }

    function addSupplier() {
      const val = document.getElementById('newSupplierInput').value.trim();
      if (val && !suppliers.includes(val)) {
        suppliers.push(val);
        saveData();
        renderSuppliersView(document.getElementById('moduleBody'));
      }
    }

    function removeSupplier(idx) {
      suppliers.splice(idx, 1);
      saveData();
      renderSuppliersView(document.getElementById('moduleBody'));
    }

    // --- 2. PERSONEL SEKMESİ ---
    function renderStaffView(container) {
      container.innerHTML = `
        <div class="bg-slate-800/80 p-3 rounded-2xl border border-white/10 space-y-2">
          <span class="font-bold text-white block">Yeni Personel Ekle:</span>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="stName" placeholder="Ad Soyad" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
            <input type="text" id="stRole" placeholder="Görevi (Barista, Kasiyer)" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
            <input type="text" id="stPhone" placeholder="Telefon" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
            <input type="number" id="stSalary" placeholder="Maaş (TL)" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
          </div>
          <button onclick="addStaff()" class="w-full bg-amber-600 font-bold py-2 rounded-xl text-white mt-1">Personeli Kaydet</button>
        </div>
        <div id="staffListContainer" class="space-y-2"></div>
      `;
      const list = document.getElementById('staffListContainer');
      staffList.forEach(s => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${s.name} <span class="text-xs text-amber-400">(${s.role})</span></div>
              <div class="text-[10px] text-slate-400">📞 ${s.phone} | 💰 Maaş: ${s.salary.toFixed(2)} TL</div>
            </div>
            <button onclick="removeStaff(${s.id})" class="text-red-400 font-bold">Sil</button>
          </div>
        `;
      });
    }

    function addStaff() {
      const name = document.getElementById('stName').value.trim();
      const role = document.getElementById('stRole').value.trim();
      const phone = document.getElementById('stPhone').value.trim();
      const salary = Number(document.getElementById('stSalary').value) || 0;

      if (name) {
        staffList.push({ id: Date.now(), name, role, phone, salary, paid: false });
        saveData();
        renderStaffView(document.getElementById('moduleBody'));
      }
    }

    function removeStaff(id) {
      staffList = staffList.filter(s => s.id !== id);
      saveData();
      renderStaffView(document.getElementById('moduleBody'));
    }

    // --- 3. MAAŞLAR SEKMESİ ---
    function renderSalariesView(container) {
      let totalSalary = 0, unpaidSalary = 0;
      staffList.forEach(s => {
        totalSalary += s.salary;
        if (!s.paid) unpaidSalary += s.salary;
      });

      container.innerHTML = `
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5">
            <span class="text-slate-400 text-[10px] block">Toplam Aylık Maaş Yükü</span>
            <span class="text-sm font-bold text-white">${totalSalary.toFixed(2)} TL</span>
          </div>
          <div class="bg-red-950/40 p-3 rounded-xl border border-red-500/30">
            <span class="text-red-400 text-[10px] block">Ödenmeyi Bekleyen Maaşlar</span>
            <span class="text-sm font-bold text-red-300">${unpaidSalary.toFixed(2)} TL</span>
          </div>
        </div>
        <div class="space-y-2 pt-2">
          ${staffList.map(s => `
            <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
              <div>
                <span class="font-bold text-white block">${s.name}</span>
                <span class="text-slate-400 text-[10px]">${s.salary.toFixed(2)} TL</span>
              </div>
              <button onclick="toggleSalaryPaid(${s.id})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${s.paid ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/30' : 'bg-red-950 text-red-300 border border-red-500/30'}">
                ${s.paid ? '✅ ÖDENDİ' : '⏳ ÖDENMEDİ'}
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function toggleSalaryPaid(id) {
      const s = staffList.find(item => item.id === id);
      if (s) {
        s.paid = !s.paid;
        saveData();
        renderSalariesView(document.getElementById('moduleBody'));
      }
    }

    // --- 4. STOK SEKMESİ (FOTOĞRAFLI & MANUEL) ---
    function renderStockView(container) {
      let totalStockValue = 0;
      stockList.forEach(s => totalStockValue += (s.amount * s.unitPrice));

      container.innerHTML = `
        <div class="bg-indigo-950/40 p-3 rounded-2xl border border-indigo-500/30 text-center flex justify-between items-center">
          <span class="text-indigo-300 font-bold">Toplam Stok Değeri:</span>
          <span class="text-base font-black text-white">${totalStockValue.toFixed(2)} TL</span>
        </div>

        <div class="bg-slate-800 p-3 rounded-2xl border border-white/10 space-y-2">
          <span class="font-bold text-white block">📷 Fotoğraf / Barkod ile Stok Ekle (AI Tarama):</span>
          <input type="file" id="stockImgInput" accept="image/*" class="hidden" onchange="handleStockPhoto(event)">
          <label for="stockImgInput" class="w-full bg-purple-600 hover:bg-purple-700 py-2.5 rounded-xl text-white font-bold text-center block cursor-pointer">
            📸 Ürün / İrsaliye Fotoğrafı Yükle
          </label>
          <p id="stockStatus" class="text-[10px] text-slate-400 text-center"></p>
        </div>

        <div class="bg-slate-800 p-3 rounded-2xl border border-white/10 space-y-2">
          <span class="font-bold text-white block">➕ Manuel Ürün Ekle:</span>
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="skName" placeholder="Ürün Adı" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
            <input type="number" id="skAmount" placeholder="Miktar" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
            <input type="number" id="skPrice" placeholder="Birim Fiyat" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
          </div>
          <button onclick="addManualStock()" class="w-full bg-indigo-600 font-bold py-2 rounded-xl text-white">Ürün Ekle</button>
        </div>

        <div class="space-y-2">
          <span class="font-bold text-slate-400 block">Stok Listesi:</span>
          <div id="stockListContainer" class="space-y-2"></div>
        </div>
      `;

      const list = document.getElementById('stockListContainer');
      stockList.forEach(s => {
        const total = s.amount * s.unitPrice;
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${s.name}</div>
              <div class="text-[10px] text-slate-400">Birim: ${s.unitPrice.toFixed(2)} TL | Toplam: <span class="text-indigo-300 font-bold">${total.toFixed(2)} TL</span></div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="changeStock(${s.id}, -1)" class="w-7 h-7 bg-red-900/60 font-bold rounded-lg text-white">-</button>
              <span class="font-bold text-white w-6 text-center">${s.amount}</span>
              <button onclick="changeStock(${s.id}, 1)" class="w-7 h-7 bg-emerald-900/60 font-bold rounded-lg text-white">+</button>
              <button onclick="removeStockItem(${s.id})" class="text-slate-500 hover:text-red-400 ml-2">🗑️</button>
            </div>
          </div>
        `;
      });
    }

    function changeStock(id, delta) {
      const item = stockList.find(s => s.id === id);
      if (item) {
        item.amount = Math.max(0, item.amount + delta);
        saveData();
        renderStockView(document.getElementById('moduleBody'));
      }
    }

    function removeStockItem(id) {
      stockList = stockList.filter(s => s.id !== id);
      saveData();
      renderStockView(document.getElementById('moduleBody'));
    }

    function addManualStock() {
      const name = document.getElementById('skName').value.trim();
      const amount = Number(document.getElementById('skAmount').value) || 0;
      const unitPrice = Number(document.getElementById('skPrice').value) || 0;

      if (name) {
        stockList.push({ id: Date.now(), name, amount, unitPrice });
        saveData();
        renderStockView(document.getElementById('moduleBody'));
      }
    }

    async function handleStockPhoto(event) {
      const file = event.target.files[0];
      const apiKey = localStorage.getItem('gemini_api_key');
      const status = document.getElementById('stockStatus');
      if (!file || !apiKey) {
        alert("Lütfen önce API anahtarınızı kaydedin!");
        return;
      }
      status.innerText = "⏳ Fotoğraftan stok bilgileri taranıyor...";

      try {
        const base64 = await toBase64(file);
        const prompt = `Görseldeki ürün adını, miktarını ve tahmini birim fiyatını çıkar. Saf JSON formatında dön:
        {"urun": "Ürün Adı", "miktar": 1, "birim_fiyat": 0.0}`;

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64.split(',')[1] } }] }]
          })
        });

        const data = await res.json();
        const cleaned = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleaned);

        stockList.push({ id: Date.now(), name: parsed.urun || 'Bilinmeyen Ürün', amount: parsed.miktar || 1, unitPrice: parsed.birim_fiyat || 0 });
        saveData();
        renderStockView(document.getElementById('moduleBody'));
      } catch (err) {
        status.innerText = "❌ Tarama başarısız oldu.";
      }
    }

    // --- 5. RAPORLAR (TÜM GİDERLER) ---
    function renderReportsView(container) {
      let totalInvoices = 0, unpaidInvoices = 0;
      invoices.forEach(i => {
        totalInvoices += i.genelToplam;
        if (!i.isPaid) unpaidInvoices += i.genelToplam;
      });

      let totalSalaries = 0, unpaidSalaries = 0;
      staffList.forEach(s => {
        totalSalaries += s.salary;
        if (!s.paid) unpaidSalaries += s.salary;
      });

      const totalMonthlyExpenses = totalInvoices + totalSalaries;
      const totalRemainingDebt = unpaidInvoices + unpaidSalaries;

      container.innerHTML = `
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-slate-800 p-3 rounded-2xl border border-white/5 text-center">
            <span class="text-slate-400 text-[10px] block">Aylık Toplam Gider (Maaş+Fatura)</span>
            <span class="text-base font-black text-white">${totalMonthlyExpenses.toFixed(2)} TL</span>
          </div>
          <div class="bg-red-950/50 p-3 rounded-2xl border border-red-500/30 text-center">
            <span class="text-red-400 text-[10px] block">Kalan Toplam Borç</span>
            <span class="text-base font-black text-red-300">${totalRemainingDebt.toFixed(2)} TL</span>
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <div class="bg-slate-800/60 p-3 rounded-xl border border-white/5 space-y-1">
            <div class="flex justify-between font-bold text-white">
              <span>🧾 Fatura Giderleri Toplamı:</span>
              <span>${totalInvoices.toFixed(2)} TL</span>
            </div>
            <div class="flex justify-between text-slate-400 text-[10px]">
              <span>Kalan Fatura Borcu:</span>
              <span class="text-red-400 font-bold">${unpaidInvoices.toFixed(2)} TL</span>
            </div>
          </div>

          <div class="bg-slate-800/60 p-3 rounded-xl border border-white/5 space-y-1">
            <div class="flex justify-between font-bold text-white">
              <span>👥 Personel Maaş Giderleri:</span>
              <span>${totalSalaries.toFixed(2)} TL</span>
            </div>
            <div class="flex justify-between text-slate-400 text-[10px]">
              <span>Kalan Maaş Borcu:</span>
              <span class="text-red-400 font-bold">${unpaidSalaries.toFixed(2)} TL</span>
            </div>
          </div>
        </div>
      `;
    }

    // --- 6. FATURALAR SEKMESİ ---
    function renderInvoicesView(container) {
      container.innerHTML = `
        <div class="bg-slate-800 p-3 rounded-2xl border border-white/10 space-y-2">
          <span class="font-bold text-white block">Tedarikçi Seç & Fatura Tara:</span>
          <select id="invSupplier" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2 text-white">
            ${suppliers.map(s => `<option value="${s}">${s}</option>`).join('')}
          </select>
          <div class="flex gap-2 pt-1">
            <input type="file" id="invImgInput" accept="image/*" class="hidden" onchange="handleInvoiceScan(event)">
            <label for="invImgInput" class="w-full bg-pink-600 hover:bg-pink-700 py-2.5 rounded-xl text-white font-bold text-center cursor-pointer">
              📸 Fatura Fotoğrafı Yükle (AI Tarama)
            </label>
          </div>
          <p id="invStatus" class="text-[10px] text-slate-400 text-center"></p>
        </div>

        <div class="space-y-2">
          <span class="font-bold text-slate-400 block">Kayıtlı Faturalar:</span>
          <div id="invoiceListContainer" class="space-y-2"></div>
        </div>
      `;

      const list = document.getElementById('invoiceListContainer');
      invoices.forEach(inv => {
        list.innerHTML += `
          <div class="bg-slate-800 p-3 rounded-xl border border-white/5 flex justify-between items-center">
            <div>
              <div class="font-bold text-white">${inv.firma} <span class="text-[10px] text-slate-400">(${inv.kategori})</span></div>
              <div class="text-[10px] text-slate-400">Tutar: <span class="text-white font-bold">${inv.genelToplam.toFixed(2)} TL</span> | ${inv.tarih}</div>
            </div>
            <button onclick="toggleInvoicePaid(${inv.id})" class="px-3 py-1.5 rounded-lg text-xs font-bold ${inv.isPaid ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/30' : 'bg-red-950 text-red-300 border border-red-500/30'}">
              ${inv.isPaid ? '✅ ÖDENDİ' : '⏳ ÖDENMEDİ'}
            </button>
          </div>
        `;
      });
    }

    async function handleInvoiceScan(event) {
      const file = event.target.files[0];
      const apiKey = localStorage.getItem('gemini_api_key');
      const supplier = document.getElementById('invSupplier').value;
      const status = document.getElementById('invStatus');

      if (!file || !apiKey) {
        alert("Lütfen önce API Anahtarınızı kaydedin!");
        return;
      }
      status.innerText = "⏳ Fatura taranıyor...";

      try {
        const base64 = await toBase64(file);
        const prompt = `Fatura detaylarını saf JSON olarak dön: {"firma_adi": "${supplier}", "tarih": "YYYY-MM-DD", "genel_toplam": 0.0}`;

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64.split(',')[1] } }] }]
          })
        });

        const data = await res.json();
        const cleaned = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const parsed = JSON.parse(cleaned);

        invoices.unshift({
          id: Date.now(),
          kategori: supplier,
          firma: parsed.firma_adi || supplier,
          tarih: parsed.tarih || new Date().toISOString().split('T')[0],
          genelToplam: Number(parsed.genel_toplam) || 0,
          isPaid: false
        });
        saveData();
        renderInvoicesView(document.getElementById('moduleBody'));
      } catch (err) {
        status.innerText = "❌ Tarama başarısız oldu.";
      }
    }

    function toggleInvoicePaid(id) {
      const inv = invoices.find(i => i.id === id);
      if (inv) {
        inv.isPaid = !inv.isPaid;
        saveData();
        renderInvoicesView(document.getElementById('moduleBody'));
      }
    }

    // --- 7. AYARLAR SEKMESİ ---
    function renderSettingsView(container) {
      const savedKey = localStorage.getItem('gemini_api_key') || '';
      container.innerHTML = `
        <div class="bg-slate-800 p-4 rounded-2xl border border-white/10 space-y-3">
          <label class="font-bold text-white block">Gemini API Key:</label>
          <input type="password" id="keyInp" value="${savedKey}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white">
          <button onclick="saveApiKey()" class="w-full bg-emerald-600 font-bold py-2.5 rounded-xl text-white">Kaydet</button>
        </div>
      `;
    }

    function saveApiKey() {
      const val = document.getElementById('keyInp').value.trim();
      localStorage.setItem('gemini_api_key', val);
      alert("✅ API Key kaydedildi!");
    }

    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
