<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS & Restoran Yönetim Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d102b;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .pos-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease-in-out;
    }
    .pos-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .pos-card:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-6 select-none">

  <!-- Üst Bilgi Çubuğu -->
  <header class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-white/10 mb-4 sm:mb-6">
    <div class="flex items-center gap-3 text-xs">
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Server</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Internet</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
    </div>

    <div class="flex items-center gap-3 text-right">
      <div class="text-xs">
        <div class="font-bold text-white tracking-wide">ALİ OSMAN BEY</div>
        <div class="text-[10px] text-slate-400">YÖNETİCİ / ÖDEME NOKTASI</div>
      </div>
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-lg">
        AO
      </div>
    </div>
  </header>

  <!-- ANA DASHBOARD -->
  <main id="mainDashboard" class="flex-1 max-w-4xl mx-auto w-full flex flex-col justify-center my-auto">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-5">
      <button onclick="openModule('faturalar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center shadow-lg shadow-pink-500/30 group-hover:scale-105 transition text-2xl">📜</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Faturalar & Giderler</span>
      </button>

      <button onclick="openModule('cariler')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-500 to-cyan-500 flex items-center justify-center shadow-lg shadow-blue-500/30 group-hover:scale-105 transition text-2xl">🏢</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Tedarikçi Carileri</span>
      </button>

      <button onclick="openModule('stoklar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition text-2xl">📦</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Stok Sayımı</span>
      </button>

      <button onclick="openModule('personel')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-105 transition text-2xl">👥</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Personel Listesi</span>
      </button>

      <button onclick="openModule('maaslar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/30 group-hover:scale-105 transition text-2xl">💰</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Maaş Takibi</span>
      </button>

      <button onclick="openModule('raporlar')" class="pos-card rounded-3xl p-5 flex flex-col items-center justify-center gap-2 group col-span-2 sm:col-span-1">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-fuchsia-500 to-pink-600 flex items-center justify-center shadow-lg shadow-fuchsia-500/30 group-hover:scale-105 transition text-2xl">📊</div>
        <span class="font-bold text-xs sm:text-sm text-slate-200">Ay Sonu Raporu</span>
      </button>
    </div>
  </main>

  <!-- MODÜL İÇERİK EKRANI -->
  <section id="moduleContent" class="hidden flex-1 max-w-4xl mx-auto w-full bg-slate-900/90 rounded-3xl p-4 sm:p-6 border border-white/10 shadow-2xl flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
      <button onclick="closeModule()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2 border border-white/10">
        ⬅️ Ana Menü
      </button>
      <h2 id="moduleTitle" class="text-sm sm:text-base font-bold text-white">Modül Başlığı</h2>
    </div>
    <div id="moduleBody" class="flex-1 overflow-y-auto space-y-4 text-xs"></div>
  </section>

  <!-- MANUEL FATURA EKLEME MODALI -->
  <div id="invoiceModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-white/10 w-full max-w-lg rounded-3xl p-5 max-h-[90vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-3">
        <h3 class="font-bold text-white text-sm">Yeni Manuel Fatura Ekle</h3>
        <button onclick="closeInvoiceModal()" class="text-slate-400 hover:text-white font-bold text-base px-2">✕</button>
      </div>
      <div class="flex-1 overflow-y-auto space-y-3 text-xs">
        <div>
          <label class="text-slate-300 font-semibold block mb-1">Tedarikçi Firma Adı:</label>
          <input type="text" id="manualFirma" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white" placeholder="Örn: İzze Kahve">
        </div>
        <div>
          <label class="text-slate-300 font-semibold block mb-1">Fatura Tarihi:</label>
          <input type="date" id="manualTarih" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white">
        </div>
        <div>
          <label class="text-slate-300 font-semibold block mb-1">Genel Toplam Tutar (TL):</label>
          <input type="number" step="0.01" id="manualTutar" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white font-bold text-emerald-400" placeholder="0.00">
        </div>
        <div>
          <label class="text-slate-300 font-semibold block mb-1">Açıklama / Ürün Notu:</label>
          <textarea id="manualNot" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white h-20" placeholder="Örn: 5 Koli Kahve Çekirdeği"></textarea>
        </div>
        <button onclick="saveManualInvoice()" class="w-full bg-pink-600 hover:bg-pink-700 font-bold py-3 rounded-xl text-white shadow-lg shadow-pink-600/30 mt-2">
          Faturayı Kaydet
        </button>
      </div>
    </div>
  </div>

  <footer class="flex justify-between items-center text-[11px] text-slate-500 pt-3 border-t border-white/5">
    <div>POS CENTURY v6.0 (Manuel Mod)</div>
    <div id="clockDisplay" class="font-bold text-slate-400">--:--</div>
  </footer>

  <script>
    let invoices = JSON.parse(localStorage.getItem('invoices_data_v20')) || [];
    let suppliers = JSON.parse(localStorage.getItem('suppliers_data_v20')) || ['İzze Kahve', 'Orka Akademi', 'Leonaza Gıda'];

    setInterval(() => {
      const now = new Date();
      const clockEl = document.getElementById('clockDisplay');
      if(clockEl) clockEl.innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    function saveData() {
      localStorage.setItem('invoices_data_v20', JSON.stringify(invoices));
      localStorage.setItem('suppliers_data_v20', JSON.stringify(suppliers));
    }

    function formatTL(num) {
      return Number(num || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' TL';
    }

    window.openModule = function(moduleName) {
      document.getElementById('mainDashboard').classList.add('hidden');
      document.getElementById('moduleContent').classList.remove('hidden');
      const title = document.getElementById('moduleTitle');
      const body = document.getElementById('moduleBody');

      if (moduleName === 'faturalar') {
        title.innerText = '📜 Fatura & Gider Yönetimi';
        renderInvoicesView(body);
      } else if (moduleName === 'cariler') {
        title.innerText = '🏢 Tedarikçi Carileri & Borçlar';
        renderSuppliersView(body);
      } else if (moduleName === 'stoklar') {
        title.innerText = '📦 Stok Yönetimi';
        renderStockView(body);
      } else if (moduleName === 'personel') {
        title.innerText = '👥 Personel Listesi';
        renderStaffView(body);
      } else if (moduleName === 'maaslar') {
        title.innerText = '💰 Maaş Takibi';
        renderSalariesView(body);
      } else if (moduleName === 'raporlar') {
        title.innerText = '📊 Ay Sonu Gider Raporu';
        renderReportsView(body);
      }
    };

    window.closeModule = function() {
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('moduleContent').classList.add('hidden');
    };

    function renderInvoicesView(container) {
      container.innerHTML = `
        <div class="flex justify-between items-center bg-slate-800 p-4 rounded-2xl border border-white/10">
          <div>
            <span class="font-bold text-white block text-sm">Hızlı Fatura Girişi</span>
            <p class="text-[11px] text-slate-400">Tedarikçi faturalarını manuel olarak ekleyin.</p>
          </div>
          <button onclick="openInvoiceModal()" class="bg-pink-600 hover:bg-pink-700 px-4 py-2.5 rounded-xl text-white font-bold text-xs shadow-lg shadow-pink-600/30">
            + Fatura Ekle
          </button>
        </div>

        <div class="space-y-2 pt-2">
          <span class="font-bold text-slate-400 block">Kayıtlı Faturalar:</span>
          <div id="invoiceListContainer" class="space-y-2"></div>
        </div>
      `;
      renderInvoiceList();
    }

    function renderInvoiceList() {
      const list = document.getElementById('invoiceListContainer');
      if (!list) return;
      if (invoices.length === 0) {
        list.innerHTML = `<div class="text-slate-500 text-center py-4">Henüz kayıtlı fatura bulunmuyor.</div>`;
        return;
      }
      list.innerHTML = '';
      invoices.forEach(inv => {
        list.innerHTML += `
          <div class="bg-slate-800/90 p-3.5 rounded-2xl border border-white/5 flex justify-between items-center hover:border-white/20 transition">
            <div>
              <div class="font-bold text-white text-sm">🏢 ${inv.firma} <span class="text-[10px] text-slate-400">(${inv.tarih})</span></div>
              <div class="text-[11px] text-indigo-300 mt-0.5">📝 ${inv.not || 'Not girilmedi'}</div>
              <div class="text-xs font-black text-emerald-400 mt-1">Tutar: ${formatTL(inv.tutar)}</div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="window.toggleInvPaid(${inv.id})" class="px-3 py-1.5 rounded-xl text-[10px] font-bold ${inv.isPaid ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/30' : 'bg-red-950 text-red-300 border border-red-500/30'}">
                ${inv.isPaid ? 'ÖDENDİ ✓' : 'ÖDENMEDİ'}
              </button>
              <button onclick="window.deleteInvoice(${inv.id})" class="text-red-400 font-bold p-1">🗑️</button>
            </div>
          </div>
        `;
      });
    }

    window.openInvoiceModal = function() {
      document.getElementById('manualTarih').value = new Date().toISOString().split('T')[0];
      document.getElementById('invoiceModal').classList.remove('hidden');
    };

    window.closeInvoiceModal = function() {
      document.getElementById('invoiceModal').classList.add('hidden');
    };

    window.saveManualInvoice = function() {
      let firma = document.getElementById('manualFirma').value.trim();
      let tarih = document.getElementById('manualTarih').value;
      let tutar = parseFloat(document.getElementById('manualTutar').value) || 0;
      let not = document.getElementById('manualNot').value.trim();

      if (!firma || tutar <= 0) {
        alert("Lütfen firma adını ve geçerli bir tutar girin!");
        return;
      }

      if (!suppliers.includes(firma)) {
        suppliers.push(firma);
      }

      invoices.unshift({
        id: Date.now(),
        firma: firma,
        tarih: tarih,
        tutar: tutar,
        not: not,
        isPaid: false
      });

      saveData();
      renderInvoiceList();
      closeInvoiceModal();

      document.getElementById('manualFirma').value = '';
      document.getElementById('manualTutar').value = '';
      document.getElementById('manualNot').value = '';
    };

    window.toggleInvPaid = function(id) {
      let i = invoices.find(x => x.id === id);
      if(i) {
        i.isPaid = !i.isPaid;
        saveData();
        renderInvoiceList();
      }
    };

    window.deleteInvoice = function(id) {
      invoices = invoices.filter(x => x.id !== id);
      saveData();
      renderInvoiceList();
    };

    function renderSuppliersView(c) {
      c.innerHTML = `
        <div class="space-y-2">
          <span class="font-bold text-slate-400 block">Tedarikçi Borç ve Cari Durumu:</span>
          ${suppliers.map(s => {
            let supInvs = invoices.filter(i => i.firma.toLowerCase() === s.toLowerCase());
            let totalDebt = supInvs.reduce((acc, i) => acc + i.tutar, 0);
            return `
              <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center border border-white/5">
                <div>
                  <div class="font-bold text-white">${s}</div>
                  <div class="text-[10px] text-amber-400">Toplam Borç: ${formatTL(totalDebt)}</div>
                </div>
                <div class="text-xs text-slate-400">${supInvs.length} Fatura</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderStockView(c) { c.innerHTML = `<div class="text-slate-400">Stok yönetimi aktif.</div>`; }
    function renderStaffView(c) { c.innerHTML = `<div class="text-slate-400">Personel listesi aktif.</div>`; }
    function renderSalariesView(c) { c.innerHTML = `<div class="text-slate-400">Maaş takibi aktif.</div>`; }
    
    function renderReportsView(c) {
      let totInv = invoices.reduce((a,b)=>a+b.tutar,0);
      c.innerHTML = `
        <div class="space-y-3">
          <div class="bg-slate-800 p-3 rounded-xl flex justify-between"><span>Toplam Fatura Gideri:</span><b class="text-pink-400">${formatTL(totInv)}</b></div>
          <div class="bg-indigo-950 p-4 rounded-xl flex justify-between border border-indigo-500/30 font-bold text-sm"><span>AYLIK TOPLAM GİDER:</span><span class="text-emerald-400">${formatTL(totInv)}</span></div>
        </div>
      `;
    }
  </script>
</body>
</html>
