<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS & Restoran Yönetim Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0d102b;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .pos-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease-in-out;
    }
    .pos-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .pos-card:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 select-none">

  <!-- Üst Bilgi Çubuğu (Header Bar) -->
  <header class="flex justify-between items-center bg-slate-900/60 p-3 rounded-2xl border border-white/10 mb-6">
    <div class="flex items-center gap-4 text-xs">
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Server</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Internet</span> <span class="text-[10px] bg-emerald-950 px-1.5 py-0.5 rounded text-emerald-300">ONLINE</span>
      </div>
    </div>

    <!-- Kullanıcı & Şube Bilgisi -->
    <div class="flex items-center gap-3 text-right">
      <div class="text-xs">
        <div class="font-bold text-white tracking-wide">ALİ OSMAN BEY</div>
        <div class="text-[10px] text-slate-400">YÖNETİCİ / ÖDEME NOKTASI</div>
      </div>
      <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white shadow-lg">
        AO
      </div>
    </div>
  </header>

  <!-- ANA DASHBOARD (KUTUCUKLAR) -->
  <main id="mainDashboard" class="flex-1 max-w-4xl mx-auto w-full flex flex-col justify-center">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6">
      
      <!-- 1. Faturalar & Cari -->
      <button onclick="openModule('faturalar')" class="pos-card rounded-3xl p-6 flex flex-col items-center justify-center gap-3 group">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-500 flex items-center justify-center shadow-lg shadow-pink-500/30 group-hover:scale-105 transition">
          <i class="fa-solid font-bold text-2xl text-white">📜</i>
        </div>
        <span class="font-bold text-sm text-slate-200">Faturalar & Cari</span>
      </button>

      <!-- 2. Stok Sayımı -->
      <button onclick="openModule('stoklar')" class="pos-card rounded-3xl p-6 flex flex-col items-center justify-center gap-3 group relative">
        <span class="absolute top-3 right-3 bg-indigo-500/20 text-indigo-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-indigo-500/30">3 Uyarı</span>
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition">
          <i class="fa-solid font-bold text-2xl text-white">📦</i>
        </div>
        <span class="font-bold text-sm text-slate-200">Stok Sayımı</span>
      </button>

      <!-- 3. Personeller & Maaşlar -->
      <button onclick="openModule('personel')" class="pos-card rounded-3xl p-6 flex flex-col items-center justify-center gap-3 group">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/30 group-hover:scale-105 transition">
          <i class="fa-solid font-bold text-2xl text-white">👥</i>
        </div>
        <span class="font-bold text-sm text-slate-200">Personel & Maaş</span>
      </button>

      <!-- 4. Raporlar -->
      <button onclick="openModule('raporlar')" class="pos-card rounded-3xl p-6 flex flex-col items-center justify-center gap-3 group">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-fuchsia-500 to-pink-600 flex items-center justify-center shadow-lg shadow-fuchsia-500/30 group-hover:scale-105 transition">
          <i class="fa-solid font-bold text-2xl text-white">📊</i>
        </div>
        <span class="font-bold text-sm text-slate-200">Raporlar</span>
      </button>

      <!-- 5. Hızlı Satış & Siparişler -->
      <button onclick="openModule('satis')" class="pos-card rounded-3xl p-6 flex flex-col items-center justify-center gap-3 group">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/30 group-hover:scale-105 transition">
          <i class="fa-solid font-bold text-2xl text-white">🛒</i>
        </div>
        <span class="font-bold text-sm text-slate-200">Hızlı Satış</span>
      </button>

      <!-- 6. Ayarlar -->
      <button onclick="openModule('ayarlar')" class="pos-card rounded-3xl p-6 flex flex-col items-center justify-center gap-3 group">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-slate-600 to-slate-800 flex items-center justify-center shadow-lg shadow-slate-700/30 group-hover:scale-105 transition">
          <i class="fa-solid font-bold text-2xl text-white">⚙️</i>
        </div>
        <span class="font-bold text-sm text-slate-200">Ayarlar</span>
      </button>

    </div>
  </main>

  <!-- MODÜL İÇERİK EKRANI (Faturalar vs. Tıklandığında Açılan Alan) -->
  <section id="moduleContent" class="hidden flex-1 max-w-4xl mx-auto w-full bg-slate-900/90 rounded-3xl p-6 border border-white/10 shadow-2xl flex flex-col">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
      <button onclick="closeModule()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-4 py-2 rounded-xl flex items-center gap-2 border border-white/10">
        ⬅️ Ana Menüye Dön
      </button>
      <h2 id="moduleTitle" class="text-base font-bold text-white">Modül Başlığı</h2>
    </div>
    
    <div id="moduleBody" class="flex-1 overflow-y-auto">
      <!-- İçerikler Dinamik Yüklenecek -->
    </div>
  </section>

  <!-- Alt Bilgi Çubuğu (Footer Status) -->
  <footer class="flex justify-between items-center text-[11px] text-slate-500 pt-4 mt-auto border-t border-white/5">
    <div>POS CENTURY v2.4</div>
    <div id="clockDisplay" class="font-bold text-slate-400">12:00</div>
  </footer>

  <script>
    // Saat Güncelleme
    setInterval(() => {
      const now = new Date();
      document.getElementById('clockDisplay').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    // Modül Aç/Kapat Mantığı
    function openModule(moduleName) {
      const mainDashboard = document.getElementById('mainDashboard');
      const moduleContent = document.getElementById('moduleContent');
      const moduleTitle = document.getElementById('moduleTitle');
      const moduleBody = document.getElementById('moduleBody');

      mainDashboard.classList.add('hidden');
      moduleContent.classList.remove('hidden');

      if (moduleName === 'faturalar') {
        moduleTitle.innerText = '📑 Faturalar & Tedarikçi Yönetimi';
        moduleBody.innerHTML = `
          <div class="space-y-4 text-xs text-slate-300">
            <div class="grid grid-cols-3 gap-3">
              <div class="bg-pink-950/40 p-3 rounded-2xl border border-pink-500/20 text-center">
                <span class="text-pink-400 block font-semibold">☕ Kahve Borcu</span>
                <span class="text-base font-bold text-white">0.00 TL</span>
              </div>
              <div class="bg-blue-950/40 p-3 rounded-2xl border border-blue-500/20 text-center">
                <span class="text-blue-400 block font-semibold">🥤 Uludağ Borcu</span>
                <span class="text-base font-bold text-white">0.00 TL</span>
              </div>
              <div class="bg-purple-950/40 p-3 rounded-2xl border border-purple-500/20 text-center">
                <span class="text-purple-400 block font-semibold">🍕 Leonaza Borcu</span>
                <span class="text-base font-bold text-white">0.00 TL</span>
              </div>
            </div>
            <div class="p-4 border-2 border-dashed border-slate-700 rounded-2xl text-center space-y-2">
              <p>Fatura Yüklemek için Kamera veya Galeriyi Kullanın</p>
              <div class="flex gap-2 justify-center">
                <button class="bg-pink-600 px-4 py-2 rounded-xl text-white font-bold">📸 Fotoğraf Çek</button>
                <button class="bg-slate-800 px-4 py-2 rounded-xl text-white font-bold border border-white/10">📁 Galeriden Seç</button>
              </div>
            </div>
          </div>
        `;
      } else if (moduleName === 'stoklar') {
        moduleTitle.innerText = '📦 Stok Sayımı & Kritik Stoklar';
        moduleBody.innerHTML = `
          <div class="space-y-2 text-xs">
            <div class="p-3 bg-slate-800/60 rounded-xl border border-white/5 flex justify-between items-center">
              <span>Espresso Çekirdek (Kg)</span>
              <span class="bg-emerald-950 text-emerald-400 font-bold px-2 py-1 rounded">12.5 Kg</span>
            </div>
            <div class="p-3 bg-slate-800/60 rounded-xl border border-white/5 flex justify-between items-center">
              <span>Tam Yağlı Süt (Litre)</span>
              <span class="bg-red-950 text-red-400 font-bold px-2 py-1 rounded">4 Litre (Kritik)</span>
            </div>
          </div>
        `;
      } else if (moduleName === 'personel') {
        moduleTitle.innerText = '👥 Personel & Maaş Takibi';
        moduleBody.innerHTML = `
          <div class="space-y-3 text-xs">
            <div class="p-3 bg-slate-800/60 rounded-xl border border-white/5 flex justify-between items-center">
              <div>
                <div class="font-bold text-white">Barista Ahmet</div>
                <div class="text-[10px] text-slate-400">Tam Zamanlı - Vardiya: Sabah</div>
              </div>
              <span class="text-amber-400 font-bold">Maaş: Ödendi</span>
            </div>
          </div>
        `;
      } else {
        moduleTitle.innerText = 'Modül Hazırlanıyor';
        moduleBody.innerHTML = `<p class="text-slate-400 text-xs text-center py-10">Bu alan geliştirme aşamasındadır.</p>`;
      }
    }

    function closeModule() {
      document.getElementById('mainDashboard').classList.remove('hidden');
      document.getElementById('moduleContent').classList.add('hidden');
    }
  </script>
</body>
</html>
